<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <meta name="description" content="Live playable 3D browser RTS client for Ants (1998) running at 20 Hz against the authentic simulation engine with WebGL2 PBR terrain, 3D ants, minimap radar, and Web Audio SFX.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23183825'/%3E%3Ccircle cx='16' cy='12' r='5' fill='%23e0b029'/%3E%3Ccircle cx='16' cy='21' r='6' fill='%232fd36e'/%3E%3C/svg%3E">
  <title>Play Ants 3D — Live Match</title>
  <link rel="stylesheet" href="play.css?v=1">
  <script src="viewer_gltf.js?v=29" defer></script>
  <script src="viewer_fx.js?v=29" defer></script>
  <script src="viewer_render.js?v=29" defer></script>
  <script src="viewer_touch.js?v=29" defer></script>
  <script src="demo_heist.js?v=29" defer></script>
  <script src="demo_border.js?v=29" defer></script>
  <script src="demo_atmo.js?v=29" defer></script>
  <script src="demo_explosion.js?v=29" defer></script>
  <script src="demo_actions.js?v=29" defer></script>
  <script src="play_audio.js?v=1" defer></script>
  <script src="play_hud.js?v=1" defer></script>
  <script src="play.js?v=1" defer></script>
</head>
<body>
  <div class="play-shell" id="play-shell">
    <canvas
      id="play-canvas"
      tabindex="0"
      aria-label="Playable 3D Ants RTS battlefield. Left-click or drag to select ants, right-click to move or attack, press H to hatch, Space or A for special ability, S to stop, WASD or arrow keys to pan, scroll to zoom, Shift-drag or Q and E to orbit."
    ></canvas>

    <div class="play-optics" id="play-optics" data-lighting="daylight" aria-hidden="true"></div>

    <!-- Screen-space floating FX overlay: unit HP micro-bars, +pts bubbles, drag marquee -->
    <div class="play-overlay-layer" id="play-overlay-layer" aria-hidden="true">
      <div class="play-hp-layer" id="play-hp-layer"></div>
      <div class="play-bubbles-layer" id="play-bubbles-layer"></div>
      <div class="play-marquee" id="play-marquee" hidden></div>
    </div>

    <!-- Top-left: 4-team score pills + match timer + connection pill -->
    <header class="hud-top-left" aria-label="Match scoreboard and status">
      <div class="score-bar glass-panel" id="hud-scores" role="region" aria-label="Team scores and eggs"></div>
      <div class="status-strip">
        <div class="timer-pill glass-panel" id="hud-timer" title="Match time remaining">10:00</div>
        <button type="button" class="conn-pill glass-panel" id="hud-conn" data-state="connecting" title="Live server connection status (click to configure or start offline mock)">
          <span class="conn-dot" aria-hidden="true"></span>
          <span id="hud-conn-label">Connecting&hellip;</span>
        </button>
        <span class="map-name-pill glass-panel" id="hud-map-label">Treasure Map</span>
      </div>
    </header>

    <!-- Top-center: fading match news toasts & pause indicator -->
    <div class="hud-top-center" aria-live="polite">
      <div class="pause-banner glass-panel" id="hud-pause-banner" hidden>
        <span>PAUSED</span>
        <button type="button" class="mini-resume-btn" id="btn-resume-inline">Resume [P]</button>
      </div>
      <div class="news-stack" id="hud-news-stack"></div>
    </div>

    <!-- Top-right: Interactive Minimap Radar + compact quick-action buttons -->
    <aside class="hud-top-right" aria-label="Minimap radar and match controls">
      <div class="minimap-frame glass-panel">
        <canvas id="hud-minimap" width="180" height="180" aria-label="Interactive minimap radar. Click or drag to move camera."></canvas>
        <span class="minimap-fps" id="hud-fps" aria-hidden="true">-- fps</span>
      </div>
      <div class="quick-tools glass-panel" role="toolbar" aria-label="Match and view controls">
        <button type="button" class="tool-btn" id="btn-new-match" title="New Match / Map Picker">
          <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><path d="M3 5.5 7.5 3.5l5 2L17 3.5v11l-4.5 2-5-2L3 16.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7.5 3.5v11M12.5 5.5v11" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          <span>Match</span>
        </button>
        <button type="button" class="tool-btn" id="btn-cam-cycle" title="Cycle Camera View: Game View / 3D RTS / Low Hero / Top-Down (1-4)">
          <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><rect x="2.5" y="5.5" width="10.5" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13 8.5 17.5 6v8L13 11.5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <span id="lbl-cam-preset">3D RTS</span>
        </button>
        <button type="button" class="tool-btn" id="btn-light-cycle" title="Cycle Lighting Preset (L)">
          <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><circle cx="10" cy="10" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M15.3 4.7l-1.4 1.4M6.1 13.9l-1.4 1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span id="lbl-light-preset">Daylight</span>
        </button>
        <button type="button" class="tool-btn icon-only" id="btn-fog-toggle" aria-pressed="false" title="Toggle Fog of War">
          <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><path d="M2.5 10s3-5 7.5-5 7.5 5 7.5 5-3 5-7.5 5-7.5-5-7.5-5Z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="10" r="2.2" fill="currentColor"/></svg>
        </button>
        <button type="button" class="tool-btn icon-only" id="btn-pause" aria-pressed="false" title="Pause or Resume Match (P)">
          <svg class="ico-pause" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="3.5" y="2.5" width="3.2" height="11" rx="1" fill="currentColor"/><rect x="9.3" y="2.5" width="3.2" height="11" rx="1" fill="currentColor"/></svg>
          <svg class="ico-play" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4.2 2.5 13.2 8l-9 5.5Z" fill="currentColor"/></svg>
        </button>
        <button type="button" class="tool-btn" id="btn-mute" data-audio="remastered" aria-pressed="false" title="Cycle Audio: Remastered / Classic 1998 / Muted (M)">
          <svg class="ico-sound-on" viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><path d="M3.5 7.5h3.2l4.3-3.5v12l-4.3-3.5H3.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M14 7.2a4 4 0 0 1 0 5.6M16.2 5a7 7 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <svg class="ico-sound-off" viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><path d="M3.5 7.5h3.2l4.3-3.5v12l-4.3-3.5H3.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M13.5 7.5 17.5 12.5M17.5 7.5 13.5 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span id="lbl-audio-mode">Remastered</span>
        </button>
        <a class="tool-btn icon-only" href="demo.html" title="Back to 3D Map Demo">
          <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>
    </aside>

    <!-- Bottom-center: Compact Tactical Command Dock -->
    <footer class="hud-bottom-dock" aria-label="Tactical unit controls">
      <div class="command-dock glass-panel" id="hud-command-dock">
        <div class="sel-summary" id="hud-sel-summary">
          <div class="sel-avatar" id="hud-sel-avatar" aria-hidden="true"></div>
          <div class="sel-meta">
            <div class="sel-title-row">
              <span class="sel-name" id="hud-sel-name">Colony Ready</span>
              <span class="sel-loot-tag" id="hud-sel-loot" hidden>+25</span>
            </div>
            <div class="sel-hp-bar" id="hud-sel-hp-bar" aria-label="Selected ant health">
              <div class="sel-hp-fill" id="hud-sel-hp-fill" style="width:100%"></div>
            </div>
            <div class="sel-sub" id="hud-sel-sub">Click ant or drag box &middot; H to Hatch</div>
          </div>
        </div>

        <div class="dock-divider" aria-hidden="true"></div>

        <div class="cmd-buttons" role="group" aria-label="Unit commands">
          <button type="button" class="cmd-btn cmd-hatch" id="cmd-hatch" title="Hatch a new Worker Ant from your anthill (H)">
            <kbd class="cmd-key">H</kbd>
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3.5c-4.2 0-7 5.2-7 10.2 0 3.7 3 6.3 7 6.3s7-2.6 7-6.3C19 8.7 16.2 3.5 12 3.5Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 12.2 11 10l2.2 2.4 2.4-1.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="cmd-lbl">Hatch</span>
            <span class="cmd-badge" id="cmd-eggs-badge">5</span>
          </button>

          <button type="button" class="cmd-btn cmd-ability" id="cmd-ability" aria-pressed="false" title="Toggle Special Ability targeting cursor (Space or A)">
            <kbd class="cmd-key">A</kbd>
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="11" cy="14" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M14.5 9.2 17 6.5M17 4v1.8M19.8 6.8H18M19 4.7l-1.2 1.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            <span class="cmd-lbl" id="cmd-ability-lbl">Ability</span>
          </button>

          <button type="button" class="cmd-btn" id="cmd-stop" title="Stop selected ants immediately (S)">
            <kbd class="cmd-key">S</kbd>
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/></svg>
            <span class="cmd-lbl">Stop</span>
          </button>

          <button type="button" class="cmd-btn" id="cmd-select-all" title="Select all of your ants (Tab)">
            <kbd class="cmd-key">Tab</kbd>
            <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><circle cx="8" cy="9" r="2.5" fill="currentColor"/><circle cx="16" cy="9" r="2.5" fill="currentColor"/><circle cx="12" cy="15.5" r="2.8" fill="currentColor"/></svg>
            <span class="cmd-lbl">All</span>
          </button>

          <button type="button" class="cmd-btn cmd-box-toggle" id="cmd-box-select" aria-pressed="false" title="Toggle Box-Select drag mode (ideal for touch screens)">
            <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><rect x="4.5" y="4.5" width="15" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="3.2 2.4"/></svg>
            <span class="cmd-lbl">Box</span>
          </button>
        </div>

        <div class="dock-divider colony-divider" aria-hidden="true"></div>

        <div class="colony-strip" id="hud-colony-strip" role="group" aria-label="Colony ant counts by class"></div>
      </div>
    </footer>

    <!-- Match Setup / Map Picker Modal -->
    <div class="modal-backdrop" id="modal-match" hidden>
      <div class="modal-card glass-panel" role="dialog" aria-modal="true" aria-labelledby="modal-match-title">
        <div class="modal-head">
          <h2 id="modal-match-title">New 3D Match</h2>
          <button type="button" class="modal-close" id="btn-close-match" aria-label="Close">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-row">
            <label for="sel-map">Map</label>
            <select id="sel-map" class="modal-select"></select>
          </div>
          <div class="form-grid-2">
            <div class="form-row">
              <label for="sel-bots">Bot Difficulty</label>
              <select id="sel-bots" class="modal-select">
                <option value="easy">Easy</option>
                <option value="medium" selected>Medium</option>
                <option value="hard">Hard</option>
                <option value="off">No Bots</option>
              </select>
            </div>
            <div class="form-row">
              <label for="sel-seat">Your Team</label>
              <select id="sel-seat" class="modal-select">
                <option value="0" selected>Green (Seat 0)</option>
                <option value="1">Red (Seat 1)</option>
                <option value="2">Blue (Seat 2)</option>
                <option value="3">Black (Seat 3)</option>
              </select>
            </div>
          </div>
          <div class="form-grid-2">
            <label class="check-row">
              <input type="checkbox" id="chk-fog">
              <span>Fog of War</span>
            </label>
            <div class="form-row compact">
              <label for="inp-seed">Seed</label>
              <input type="number" id="inp-seed" class="modal-input" value="1" min="1" max="999999">
            </div>
          </div>
          <div class="modal-hint" id="modal-ws-hint">Connected via binary WebSocket to real C++ 20 Hz engine.</div>
        </div>
        <div class="modal-foot">
          <button type="button" class="btn-secondary" id="btn-start-mock">Practice Offline</button>
          <button type="button" class="btn-primary" id="btn-launch-match">Start Match</button>
        </div>
      </div>
    </div>

    <!-- Victory / Defeat Overlay -->
    <div class="modal-backdrop" id="modal-victory" hidden>
      <div class="modal-card victory-card glass-panel" role="dialog" aria-modal="true" aria-labelledby="victory-title">
        <div class="victory-crest" id="victory-crest" aria-hidden="true">&#x2605;</div>
        <h2 class="victory-title" id="victory-title">Victory!</h2>
        <p class="victory-sub" id="victory-sub">Green Colony claims the backyard!</p>
        <div class="victory-table" id="victory-table"></div>
        <div class="modal-foot center">
          <button type="button" class="btn-secondary" id="btn-victory-maps">Change Map</button>
          <button type="button" class="btn-primary" id="btn-play-again">Play Again</button>
        </div>
      </div>
    </div>

    <!-- Initial Loading / Connection Overlay -->
    <div class="loading-overlay" id="play-loading">
      <div class="loading-card glass-panel">
        <div class="loading-spinner" aria-hidden="true"></div>
        <h2 id="play-loading-title">Preparing 3D Backyard&hellip;</h2>
        <p id="play-loading-msg">Connecting to live match server and streaming 3D ant models.</p>
        <div class="loading-actions" id="play-loading-actions" hidden>
          <button type="button" class="btn-secondary" id="btn-retry-ws">Retry Server</button>
          <button type="button" class="btn-primary" id="btn-fallback-mock">Play Offline Mock</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
