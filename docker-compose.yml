services:
  ants-beta:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # optional: which build this is (page footer, --version); without it the image takes the commit from the clone's .git files, else the build time
        ANTS_BUILD_ID: ${ANTS_BUILD_ID:-}
    container_name: ants-beta
    restart: unless-stopped
    ports:
      - "${ANTS_PORT:-19980}:80"
    networks:
      - proxy-network
    labels:
      - "org.playants.version=0.0.9"

networks:
  proxy-network:
    external: true
