services:
  ants-beta:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ants-beta
    restart: unless-stopped
    ports:
      - "${ANTS_PORT:-19980}:80"
    networks:
      - proxy-network
    labels:
      - "org.playants.version=0.0.9"

networks:
  proxy-network:
    external: true
