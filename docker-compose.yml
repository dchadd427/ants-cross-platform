services:
  ants-beta:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # optional: which build this is (page footer, --version); without it the image takes the commit from the clone's .git files, else the build time
        ANTS_BUILD_ID: ${ANTS_BUILD_ID:-}
    container_name: ants-beta
    restart: unless-stopped
    # as in docker-compose.stack.yml: a list of reverse proxies of your own (ANTS_TRUSTED_PROXIES_FILE: the full path of a file on this machine), or nothing (/dev/null is an empty file: the web image's list is used)
    volumes:
      - ${ANTS_TRUSTED_PROXIES_FILE:-/dev/null}:/etc/nginx/ants-trusted-proxies.d/own.conf:ro
    ports:
      - "${ANTS_PORT:-19980}:80"
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
