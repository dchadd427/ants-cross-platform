# The dedicated game server (Dockerfile.server). An example: the values below go in a .env file next to this file (.gitignore keeps it out of the repository); all of them are optional.
#
#   ANTS_SERVER_SECRET=<a long random secret>       the bearer secret of the control interface (optional: without it the server makes one the first time it starts,
#                                                   prints it once in its log and keeps it in /results/control-secret of the volume ants-server-results)
#   ANTS_MAPS_DIR=/path/to/the/maps                 a folder of .lvl files that rooms may use instead of the six maps of the original game in the image (optional, mounted read-only)
#   ANTS_SERVER_PORT=4001                           the public TCP game port of native clients (optional)
#
#   docker compose -f docker-compose.server.yml up -d --build
#
# Only the TCP game port is open to other machines. The WebSocket port (a reverse proxy that ends TLS passes browsers to it) and the control interface
# (the lobby's backend calls it) are published on the host's loopback address only; a proxy or backend on another machine reaches them through a tunnel.
# The service also joins the network of the site's container (docker-compose.yml): its nginx passes /ws to "ants-server:4002". The services on that
# network trust each other: put only containers you trust on it.
services:
  ants-server:
    build: &server-build
      context: .
      dockerfile: Dockerfile.server
      args:
        # optional: which build this is (page footer, --version); without it the image takes the commit from the clone's .git files, else the build time
        ANTS_BUILD_ID: ${ANTS_BUILD_ID:-}
    image: ants-server
    container_name: ants-server
    restart: unless-stopped
    # waits for the one-shot helper below (it must have exited with 0: it always does)
    depends_on:
      ants-results-init:
        condition: service_completed_successfully
    # A stop gives the server this long before docker kills it: on SIGTERM it makes the restart records of its running rooms durable (one fsync a room, a few milliseconds) and exits;
    # the records stay in /results/restart of the volume below and the server that starts again brings the matches back (docs/NETWORK_PORT.md "Restart records"; only rooms that hold
    # seats keep a record: every room does unless --no-reconnect, below). 15 s is the default 10 s and room for a slow volume (256 rooms at 30 ms for a flush are 7.7 s). Keep the volume: it holds the records.
    stop_grace_period: 15s
    # The page web/lobby.html (the front page) needs demo rooms, which are off by default: uncomment to allow them. The maps folder must hold the demo map and every map of
    # --demo-maps (the page offers the six maps of the original); the number of rooms is 1 to 255 (0, or 256 and more, stop the server at startup); a demo room waits
    # ten minutes for its players; demo rooms are open to anyone who can reach a game port, so their number is bounded. Keep the number of rooms times --log-mb under the 256 MiB that all the turn logs share (see docker-compose.stack.yml).
    # command: ["--port", "4001", "--ws-port", "4002", "--ctl-port", "4010", "--demo-rooms", "48", "--demo-map", "TREASURE.LVL", "--demo-maps", "TINY.LVL,SMALL.LVL,MEDIUM.LVL,GAUNTLET.LVL,TREASURE.LVL,ISLANDS.LVL", "--log-mb", "4"]
    # Reconnect (network protocol 10; ON by default since v0.6.0, when the game's own clients came back by themselves): rooms hold the seat of a player whose connection is lost and pause the match for
    # everybody; "--no-reconnect" turns that off (a lost player is dropped at once and no restart record is kept; the last of "--reconnect" and "--no-reconnect" wins). The others vote after 30 s: "--hold-vote-seconds" 5 - 3600; the match's
    # total pause is capped: "--max-pause-seconds" 60 - 86400, default 1800; one absence may spend "--max-catch-up-seconds" 10 - 3600 (300) catching up; after a pause of 3 s or more the match is held for
    # "--resume-countdown-seconds" 0 - 60 (10) before it goes on; the turn log that a returning player is given is at most "--log-mb" 1 - 256 MiB a room, 256 MiB for all rooms. A room's "reconnect" key in the
    # control interface overrides the default.
    # Restart records (the matches of rooms that hold seats survive a restart of the server): on by default into /results/restart; "--restart-dir DIR" chooses another folder (on a volume),
    # "--no-restart-records" switches them off, "--restart-vote-seconds" (30 - 3600, default 90) is how long the others wait before they may vote on a seat that has not come back after a
    # restart, "--restart-budget-mb" (1 - 4096, default 256) the disk that all the records may take.
    # command: ["--port", "4001", "--ws-port", "4002", "--ctl-port", "4010", "--max-pause-seconds", "600"]
    # Replays (docs/REPLAYS.md "On the game server"): the server keeps every match of its rooms that ran 30 seconds or more, for 30 days and 100 MiB together, in /results/replays of the volume (--no-replays switches that off,
    # --replay-demo keeps the demo rooms' matches too, "--replays-days" 1 - 3650 and "--replays-max-mb" 1 - 4096 change the two limits). The operator can list and fetch them with the secret (GET /replays and GET /replays/<file> of the control interface). The files hold the names that the players typed (a player with no name shows as a color), and no address, room code or chat. A public,
    # read-only list and download without the secret (it shows those names) is OFF unless the server is started with "--replay-port N" (the stack file docker-compose.stack.yml starts it with 4020, where docker/nginx.conf passes /replays to):
    # command: ["--port", "4001", "--ws-port", "4002", "--ctl-port", "4010", "--replay-demo", "--replay-port", "4020"]
    environment:
      ANTS_SERVER_SECRET: ${ANTS_SERVER_SECRET:-}
    volumes:
      - ${ANTS_MAPS_DIR:-ants-maps}:/maps:ro
      - ants-server-results:/results
    ports:
      - "${ANTS_SERVER_PORT:-4001}:4001"
      - "127.0.0.1:${ANTS_SERVER_WS_PORT:-4002}:4002"
      - "127.0.0.1:${ANTS_SERVER_CTL_PORT:-4010}:4010"
    # the site's nginx (docker-compose.yml) reaches the WebSocket port by this name on the shared network
    networks:
      - proxy-network
    # the program needs nothing but its sockets and the results folder
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64

  # One-shot helper of ants-server: before each start of the server it makes the TOP folder /results of the volume ants-server-results belong to the user ants (the user that the server runs as, made in
  # Dockerfile.server). A volume that was made before the image gave /results to ants keeps its old owner (root), and the server, which is not root, then cannot write /results/<room>.json. Only /results itself is
  # changed (chown without -R: no file or folder below it is touched). When the owner is already ants it prints that and does nothing; a failed or slow chown (timeout 20) prints one line and the helper
  # ALWAYS exits 0, so it never keeps the server from starting. It runs as root with one capability (CHOWN), no network, a read-only root file system and no ports; the server keeps its own user and
  # its own limits. It uses the image of the server (the same build) so that the user ants exists for it and a NEW volume is filled from the image's /results, which belongs to ants. The entrypoint of the
  # image is replaced by a shell. In a compose file "$$" is a single "$" for the shell.
  ants-results-init:
    build: *server-build
    container_name: ants-results-init
    restart: "no"
    user: "0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["if [ \"$$(stat -c %U /results)\" = ants ]; then echo \"ants-results-init: /results already belongs to ants, nothing to do\"; else timeout 20 chown ants: /results && echo \"ants-results-init: /results now belongs to ants\" || echo \"ants-results-init: could not change the owner of /results, left as it is\"; fi; exit 0"]
    volumes:
      - ants-server-results:/results
    network_mode: none
    healthcheck:
      disable: true
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 16

volumes:
  ants-server-results:
  ants-maps:

networks:
  proxy-network:
    external: true
