server {
    listen 80;
    server_name beta.playants.org localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Ensure WebAssembly and game data MIME types are recognized
    types {
        include /etc/nginx/mime.types;
        application/wasm wasm;
        application/octet-stream data;
    }

    # Gzip compression for WebAssembly, JS, and game asset bundles
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/wasm
        application/octet-stream;

    # WebAssembly & modern browser security headers
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # WASM and preloaded binary game archive caching
    location ~* \.(wasm|data)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    location ~* \.(html|css|js)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }
}
