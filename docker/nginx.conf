server {
    listen 80;
    listen [::]:80;
    server_name beta.playants.org localhost;

    root /usr/share/nginx/html;
    index index.html;


    # Gzip compression for WebAssembly, JS, and game asset bundles
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/wasm
        application/octet-stream;

    # WebAssembly & modern browser security headers
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /catalog {
        return 301 /asset_catalog/;
    }

    location /viewer {
        return 301 /asset_catalog/;
    }

    # Asset Catalog & Viewer: Use ^~ to prevent regular expression interception
    location ^~ /asset_catalog/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Audio & media files: caching
    location ~* \.(wav|mp3|ogg)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|bmp)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # WASM files: explicit MIME type, strict no-store cache busting, and security headers
    location ~* \.wasm$ {
        default_type application/wasm;
        expires -1;
        etag off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # Data package: explicit MIME type, strict no-store cache busting, and security headers
    location ~* \.data$ {
        default_type application/octet-stream;
        expires -1;
        etag off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    location ~* \.(html|css|js)$ {
        expires -1;
        etag off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }
}
