# One request a second per client address for the status answer of the game server (/busy, below); a flood is answered 503 and never reaches the server
limit_req_zone $binary_remote_addr zone=ants_busy:1m rate=1r/s;
# The recorded matches of the game server (/replays, below). Behind a reverse proxy every visitor may have the proxy's address, so these limits are sized to hold for the whole site, like the
# numbers' below: twenty a second for the list (it comes from the cache below, so the game server is asked about once in five seconds), ten a second for the files (each is one read of a small file by
# the game server). A flood is answered 503 and never reaches the server, and the two kinds do not use up each other's allowance.
limit_req_zone $binary_remote_addr zone=ants_replays:1m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ants_replay_files:1m rate=10r/s;
# The matches that run now (/live, below) have allowances of their own, so that a crowd that watches (a page asks for the list every ten seconds and for the match it watches every four) does not use up
# what the downloads of replays have, nor the other way round: twenty a second for the list, thirty for the snapshots (a hundred and twenty watchers at one request in four seconds, each answer one
# cache entry of two seconds). A flood is answered 503 and never reaches the server.
limit_req_zone $binary_remote_addr zone=ants_live:1m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ants_live_files:1m rate=30r/s;
# The match history (/history, below) has allowances of its own too, so that a page that lists and filters it does not use up what the replays and the live matches have. A list WITHOUT a query is the
# page's own list and comes from the cache below: ten a second. A list WITH a query (a filter, a sort, a search) is not cheap: the game server answers it from its database on its one main thread, and
# a search can scan every match, so the game server boxes each such query in time and in budget and answers 503 when it is over. Here a request with a query has a much lower allowance, two a second
# for each address with a burst of five (one zone, whose key is empty, and so counts nothing, for a request without a query: the two maps below pick the zone), and the answers to it are kept for
# five seconds in a cache of its own, keyed on the arguments, so that many visitors who ask for the same thing cost the game server one query. Single matches have twenty a second (a primary-key read
# each). A flood is answered 503 and never reaches the server.
map $is_args $history_plain_key {
    default "";
    "" $binary_remote_addr;
}
map $is_args $history_query_key {
    default $binary_remote_addr;
    "" "";
}
limit_req_zone $history_plain_key zone=ants_history:1m rate=10r/s;
limit_req_zone $history_query_key zone=ants_history_query:1m rate=2r/s;
limit_req_zone $binary_remote_addr zone=ants_history_items:1m rate=20r/s;
# The sum of the maps of deaths of a game map (/history/deaths?map=NAME, below): the game server adds up the stored positions of up to 2,000 matches (once for each state of the history, then from its own cache), so
# the allowance is low, two a second for each address with a burst of five, and the answers are kept for thirty seconds under their arguments in the history's own small cache.
limit_req_zone $binary_remote_addr zone=ants_history_deaths:1m rate=2r/s;
# The list of maps (/maps, below) and the players' maps themselves (/maps/previews/, /maps/files/): allowances of their own, sized for the whole site. The list comes from the cache below (the game server is asked
# about once in five seconds), twenty a second. The previews are small static files and a map list with pictures asks for fifty to five hundred at once: two hundred a second with a burst of four hundred. The .lvl files are
# one per game started from the list: twenty a second. A flood is answered 503 and never reaches the game server or the disk.
limit_req_zone $binary_remote_addr zone=ants_maps:1m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ants_map_previews:1m rate=200r/s;
limit_req_zone $binary_remote_addr zone=ants_map_files:1m rate=20r/s;
# The map submissions (docs/MAP_SUBMISSIONS.md): the paths of a player's browser (/submissions) and the owner's (/admin, /admin/api) are passed to the game server's SUBMISSION door;
# every one has an allowance of its own, and nothing the visitor sent goes on but the few headers that each block names. A map that is sent costs the game server a check, so the POST has its own small
# allowance for each client address (ten a minute, a burst of three: the server limits the real thing, three a day); reading one's own list is cheap. The owner's page and its API come from a few people:
# twenty a second is for each address (the whole site's when every visitor has the proxy's address: docs/MAP_SUBMISSIONS.md "Deploying"), and the sign-in (POST /admin/api/login) is six a minute. A flood is answered 503 and never reaches the game server.
map $request_method $submit_post_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $submit_post_key zone=ants_submit_post:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ants_submit_read:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ants_admin_api:1m rate=20r/s;
map $uri $admin_login_key {
    default "";
    /admin/api/login $binary_remote_addr;
}
limit_req_zone $admin_login_key zone=ants_admin_login:1m rate=6r/m;
# The test maps of the Map Maker (docs/MAP_SUBMISSIONS.md, "Test maps") go to a door of their own, the game server's TEST-MAP door (--test-map-port 4031), and never to the submission door: one route, POST /test-maps,
# ten a minute for each client address (a burst of three; the game server holds the real limits, 30 an hour for an address, 600 for everybody), a map of at most 2 MiB.
map $request_method $test_map_post_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $test_map_post_key zone=ants_test_maps:1m rate=10r/m;
# A map file is at most 512 KB (524,288 bytes) for a Classic map and 4 MiB for an Extended one (the game server holds each kind to its own limit on the head, before it reads a byte): the same
# decision is made here, so that only a request that says kind=extended is let in with more than 512 KB. The kind is read from the raw query, exactly as the game server reads it (its first "kind"
# parameter, the name in lower case, the value exactly "extended"): nginx's own $arg_kind ignores the case of the name, the server does not, and the two must not disagree. Any other kind, none, or a
# Content-Length that has a leading zero gets the small limit (413 when it is over).
map $args $submit_extended {
    default 0;
    "~^(?:(?!kind=)[^&]*&)*kind=extended(?:&|$)" 1;
}
map "$submit_extended:$http_content_length" $submit_too_big {
    default 1;
    "~^[01]:$" 0;                                   # (no Content-Length: a GET, or a body that nginx counts itself against client_max_body_size)
    "~^1:(?:0|[1-9][0-9]{0,6})$" 0;
    "~^0:(?:0|[1-9][0-9]{0,4}|[1-4][0-9]{5}|5[01][0-9]{4}|52[0-3][0-9]{3}|524[01][0-9]{2}|5242[0-7][0-9]|52428[0-8])$" 0;
}
# The numbers of the front page (/stats and /stats/local, below). Behind a reverse proxy every visitor may have the proxy's address, so these limits are sized to hold for the whole site:
# twenty a second for the numbers (they come from the cache below, so the game server is asked about once in five seconds), sixty a minute for the reports of single-player games
# (the game server caps its own count at 120 a minute: that is the bound that matters)
limit_req_zone $binary_remote_addr zone=ants_stats:1m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ants_local:1m rate=60r/m;
# The chat hub (/hub/ws, below; docs/HUB.md): sockets that are open at one time for one client address. The hub counts eight for each address itself (the address nginx tells it in X-Client-Address) and
# 500 in all; this is the wider net in front of it, for the case that the hub is slow to say no. Behind a reverse proxy every visitor may have the proxy's address (docs/MAP_SUBMISSIONS.md "Deploying"),
# so the number is not small. Over it: 429, and the hub is not asked.
limit_conn_zone $binary_remote_addr zone=ants_hub_conn:1m;
# ... and how fast new ones may be opened: each handshake costs the hub a welcome of up to 50 KB and its CPU, a client address gets five a second with a burst of ten (more is answered 503 and never reaches
# the hub). Whole-site numbers while every visitor has the proxy's address, like the zones above; a hub that restarts is reached again by its clients over a minute or two (they retry with a growing pause).
limit_req_zone $binary_remote_addr zone=ants_hub_req:1m rate=5r/s;
# The cache of /stats: one small entry, five seconds long (the list of /replays has an entry of its own in it: another key; so have the list of /live and every snapshot of a live match, two seconds long: a
# snapshot is some tens of kilobytes and 1 MiB at the most, hence the room; so has the list of /history WITHOUT filters, five seconds long: a list with filters has a cache of its own below and a single match is never kept, or a page
# that asks for a thousand different lists would push the numbers of the front page out of this one small cache; so has the list of /maps, five seconds long, 150 kB)
proxy_cache_path /var/cache/nginx/ants_stats keys_zone=ants_stats_cache:1m max_size=8m inactive=1m use_temp_path=off;
# The lists of /history WITH a query, five seconds, one entry for each distinct query (at most 400 characters of the allowed ones), in a cache of their own so that made-up queries cannot push the
# numbers of the front page out of the one above; it holds 8 MB at the most and the oldest entries go first
proxy_cache_path /var/cache/nginx/ants_history keys_zone=ants_history_cache:1m max_size=8m inactive=1m use_temp_path=off;
# Which cache a list uses: the one of the numbers for the list without a query, the history's own for a list with one
map $is_args $history_cache {
    default ants_history_cache;
    "" ants_stats_cache;
}

# The access log of the paths that carry a player's text in their address (the map's name, the maker and the note of POST /submissions; the owner's calls): the stock format writes the whole request line,
# query and all, so every note would be copied into the log (percent-encoded, easy to read back) for anyone or any program that reads the container's output. This one writes the path ($uri) and no query.
log_format ants_noquery '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name beta.playants.org localhost;

    root /usr/share/nginx/html;
    index index.html;

    # The real address of a visitor behind a reverse proxy: the files of this folder (a glob: no file is no error) list the proxies that may be believed (set_real_ip_from ...; real_ip_header X-Forwarded-For; real_ip_recursive on;).
    # The image's one file is all comments, so $remote_addr is the address of the connection. The map submissions count an address by $remote_addr (docker/trusted-proxies.conf, docs/MAP_SUBMISSIONS.md "Deploying").
    include /etc/nginx/ants-trusted-proxies/*.conf;


    # Gzip compression for WebAssembly, JS, and game asset bundles
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/wasm
        application/octet-stream;

    # WebAssembly & modern browser security headers
    server_tokens off;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Avoid schema or port mismatch when behind reverse proxy
    absolute_redirect off;

    location = /catalog {
        return 301 /asset_catalog/;
    }

    location = /viewer {
        return 301 /asset_catalog/;
    }

    location = /asset_catalog {
        return 301 /asset_catalog/;
    }

    location = /changelog {
        return 301 /changelog.html;
    }

    location = /legal {
        return 301 /legal.html;
    }

    # The match history's pages (docs/REPLAYS.md "The match pages"): /matches is the list; the old list of the recordings (/watch.html) is the list of every match now. Both are 301s like /changelog.
    # (/live and /history are the game server's JSON routes below, so the pages are live.html, matches.html and match.html.)
    location = /matches {
        return 301 /matches.html;
    }

    location = /watch.html {
        return 301 /matches.html;
    }

    # Every Cache-Control of this file is written out with add_header and no `expires` directive: `expires` makes nginx add a Cache-Control line of its own, and a second one
    # followed from the add_header (two headers on favicon.png, the sprites, the sounds and the images)

    # Direct fallback aliases for /sprites/ and /sounds/
    location ^~ /sprites/ {
        alias /usr/share/nginx/html/asset_catalog/sprites/;
        add_header Cache-Control "public, max-age=604800, no-transform" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /sounds/ {
        alias /usr/share/nginx/html/asset_catalog/sounds/;
        add_header Cache-Control "public, max-age=604800, no-transform" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Asset Catalog sprites & sounds caching within /asset_catalog/
    location ^~ /asset_catalog/sprites/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800, no-transform" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /asset_catalog/sounds/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800, no-transform" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The map maker's sprite atlas (docs/MAP_EDITOR.md, "Sprites"): the index and the two sheets are made together by the image's build, so every use is revalidated (a 304 costs nothing), and the
    # PNG rule below (a week) must not keep an old sheet beside a new index. ^~ so that no regular expression takes it.
    location ^~ /mapmaker_atlas/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Asset Catalog & Viewer: Use ^~ to prevent regular expression interception
    location ^~ /asset_catalog/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The game server's WebSocket door (ants_server --ws-port 4002, docs/NETWORK_PORT.md): the game pages connect to wss://<this host>/ws.
    # The server runs in its own container (docker-compose.server.yml, service "ants-server" on the same network). The name is resolved when a request
    # comes (Docker's own resolver), so this container starts, and the rest of the site works, whether or not the server is there (502 until it is).
    location = /ws {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ants_server ants-server:4002;
        proxy_pass http://$ants_server;
        proxy_http_version 1.1;                                   # the upgrade needs HTTP/1.1 to the backend
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;                                 # a quiet game is not a dead one (the default is 60 s)
        proxy_send_timeout 3600s;
    }

    # The chat hub's door (the service ants-hub, port 4040, docs/HUB.md): the pages connect to wss://<this host>/hub/ws. Like /ws it is resolved when a request comes, so this container starts, and the rest of
    # the site works, whether or not the hub is there; without it the answer is 503 with a JSON body (the named location below), never a page of the site. The visitor's request is not passed on: only the
    # headers of the upgrade, the Origin (the hub lets in the site's own origin only), the cookie and Sec-Fetch-Site (the login of a later change), and X-Client-Address, which the hub believes and which a
    # visitor's header of that name never reaches (proxy_pass_request_headers is off and the one value is set here). A GET without a query; sixteen sockets at once for an address and five new ones a second.
    # The hub pings every 25 seconds, so 120 seconds without a byte is a dead one. Neither the hub nor this block keeps a log of the address, the cookie or the browser: the access log is off here (the
    # server's default format would write the address, the referrer and the user agent of every handshake).
    location = /hub/ws {
        if ($request_method != GET) { return 405; }
        if ($is_args) { return 404; }
        access_log off;
        limit_req zone=ants_hub_req burst=10 nodelay;
        limit_req_status 503;
        limit_conn ants_hub_conn 16;
        limit_conn_status 429;
        error_page 502 504 = @hub_off;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ants_hub ants-hub:4040;
        proxy_pass http://$ants_hub;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
        proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
        proxy_set_header Origin $http_origin;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
        proxy_set_header X-Client-Address $remote_addr;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_hide_header X-Content-Type-Options;
    }

    # What /hub/ws answers when the hub is not there (the name does not resolve, or nothing listens): 503 with a JSON body that a page can read
    location @hub_off {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 503 '{"error":"hub_off","message":"Chat is not available right now."}';
    }

    # The game server's public, read-only status (ants_server's GET /busy on its WebSocket port): {"matches": N, "players": M}, plain counts, no names, no codes. The deploy job of CI polls it
    # and restarts the site when no match runs (docs/WORKFLOW.md). Like /ws it goes to the WebSocket port of the server, but as a plain GET and nothing else: any other method is 405, a query
    # is 404 (the status takes no parameter), nothing of the request body or of an upgrade is passed on, and the answer is never cached (the server's own Cache-Control: no-store passes through; add_header here would make it two lines).
    location = /busy {
        if ($request_method != GET) { return 405; }
        if ($is_args) { return 404; }
        limit_req zone=ants_busy burst=5 nodelay;
        limit_req_status 503;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ants_server ants-server:4002;
        proxy_pass http://$ants_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "close";
        proxy_set_header Host $host;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_hide_header X-Content-Type-Options;                 # (the server's own nosniff line is the one that this block inherits: not twice)
    }

    # The numbers of the front page (ants_server's GET /stats on its WebSocket port, docs/SERVER.md, "The site statistics, GET /stats and POST /stats/local"): the games played on the server and the single-player games that browsers
    # report, plain counts, no names, no codes. Like /busy it goes to the WebSocket port of the server as a plain GET and nothing else: any other method is 405, a query is 404, no body, upgrade or
    # header of the visitor is passed on (only Host and Connection: no cookie reaches the server, whatever its size), and twenty a second per client address are let through (503 beyond).
    # The answer is cached for five seconds, one entry for everybody, so the game server is asked about once in five seconds however many people look; an old answer is served while a new one is
    # fetched and when the server does not answer. The server's own Cache-Control: no-store is ignored for the cache and still reaches the browser.
    location = /stats {
        if ($request_method != GET) { return 405; }
        if ($is_args) { return 404; }
        limit_req zone=ants_stats burst=100 nodelay;
        limit_req_status 503;
        proxy_cache ants_stats_cache;
        proxy_cache_key "ants-stats";
        proxy_cache_valid 200 5s;
        proxy_ignore_headers Cache-Control;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ants_server ants-server:4002;
        proxy_pass http://$ants_server;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Connection "close";
        proxy_set_header Host $host;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_hide_header X-Content-Type-Options;                 # (the server's own nosniff line is the one that this block inherits: not twice)
    }

    # A browser tells the server that a single-player game began (POST /stats/local, the game page does it with fetch): a POST and nothing else, no query, never a body (the server is given an empty
    # POST whatever came) and nothing of the visitor's headers (only Host, Connection and Content-Length). A browser that says the request is cross-site is refused (403) before it counts against
    # the limit: the game page's own report is same-origin. Sixty a minute per client address with a burst of 20 (the rest are answered 503 here and never reach the server, which caps its own
    # count at 120 a minute too). The answer is the server's 204.
    location = /stats/local {
        if ($request_method != POST) { return 405; }
        if ($is_args) { return 404; }
        if ($http_sec_fetch_site = "cross-site") { return 403; }
        limit_req zone=ants_local burst=20 nodelay;
        limit_req_status 503;
        client_max_body_size 1k;                                  # (a report has no body: a larger one is 413 and is not read)
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ants_server ants-server:4002;
        proxy_pass http://$ants_server;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Connection "close";
        proxy_set_header Host $host;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "0";
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_hide_header X-Content-Type-Options;
    }

    # The matches that the game server keeps (docs/REPLAYS.md "On the game server"): the list, GET /replays, and one file, GET /replays/<file>, a name of the shape that the server's own store makes
    # (ants-<MAP>-<date>-<time>Z.antsrep; the store decides which exist). They come from the REPLAY port of the server (ants_server --replay-port 4020: read only, no secret; the files and the list hold the names that the
    # players typed, and no address, room code or chat), not from the WebSocket port, and they are public: the stack file starts the server with that port (ANTS_REPLAY_PORT=0 switches the door off), and a server that has no such port, or is not there,
    # is answered 404 with a JSON body (the named location below), never a 502 page. Like /busy these go to the server as a plain GET and nothing else: any other method is 405, a query is 404, a name of
    # another shape is 404 here and never reaches the server, no body, upgrade or header of the visitor is passed on (only Host and Connection), and the allowances of the zones above are the whole site's
    # (503 beyond). The checks come before the limit, so that a bad request does not use up the allowance. The browser is never told to keep an answer (the server's own Cache-Control: no-store passes
    # through); the LIST is cached here for five seconds, like /stats (one entry for everybody; an old list is served while a new one is fetched and when the server does not answer).
    location = /replays {
        if ($request_method != GET) { return 405; }
        if ($is_args) { return 404; }
        limit_req zone=ants_replays burst=100 nodelay;
        limit_req_status 503;
        proxy_cache ants_stats_cache;
        proxy_cache_key "ants-replays";
        proxy_cache_valid 200 5s;
        proxy_ignore_headers Cache-Control;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        error_page 502 504 = @replays_off;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ants_replays ants-server:4020;
        proxy_pass http://$ants_replays;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Connection "close";
        proxy_set_header Host $host;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_hide_header X-Content-Type-Options;                 # (the server-level nosniff line applies once)
    }

    location ^~ /replays/ {
        if ($request_method != GET) { return 405; }
        if ($is_args) { return 404; }
        if ($uri !~ "^/replays/ants-[A-Za-z0-9_]{1,24}-[0-9]{8}-[0-9]{6}Z(-[0-9]{1,4})?\.antsrep\z") { return 404; }
        limit_req zone=ants_replay_files burst=20 nodelay;
        limit_req_status 503;
        error_page 502 504 = @replays_off;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ants_replays ants-server:4020;
        proxy_pass http://$ants_replays;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Connection "close";
        proxy_set_header Host $host;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_hide_header X-Content-Type-Options;
    }

    # The matches that run now (docs/REPLAYS.md "On the game server", "Live"): the list, GET /live, and the snapshot of one, GET /live/<id>, an id of the shape that the server's own board makes
    # (<MAP>-<date>-<time>Z with a -2, -3 ... when two began in one second; the board decides which exist, and the id holds nothing of the room). The same door of the same server as /replays above
    # (the replay port: read only, no secret), asked the same way: only a plain GET without a query goes through (405 and 404 otherwise), an id of another shape is 404 here and never reaches the server,
    # nothing of the visitor's request is passed on but Host and Connection, the checks come before the limit, and a server with no such door is answered 404 with a JSON body (the named location below). Three things are
    # their own: the allowances (the zones ants_live and ants_live_files above); the cache, for TWO seconds, the list in one entry and a snapshot in one entry for every id (the key holds the uri, which
    # is an id's shape and nothing else by then, and only a 200 is kept, so made-up ids fill no cache); and what is served when the server does not answer: an answer that is being renewed is served
    # old, but nothing else, because a snapshot that is repeated for minutes looks like a match that still goes on and has stopped (the 404 below is the truth). The server's own Cache-Control: no-store passes
    # through, so no browser keeps an answer. The 404 of a match that is over (it names the replay file, for fifteen minutes) is the server's and is not cached.
    location = /live {
        if ($request_method != GET) { return 405; }
        if ($is_args) { return 404; }
        limit_req zone=ants_live burst=100 nodelay;
        limit_req_status 503;
        proxy_cache ants_stats_cache;
        proxy_cache_key "ants-live";
        proxy_cache_valid 200 2s;
        proxy_ignore_headers Cache-Control;
        proxy_cache_lock on;
        proxy_cache_use_stale updating;
        error_page 502 504 = @replays_off;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ants_replays ants-server:4020;
        proxy_pass http://$ants_replays;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Connection "close";
        proxy_set_header Host $host;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_hide_header X-Content-Type-Options;
    }

    location ^~ /live/ {
        if ($request_method != GET) { return 405; }
        if ($is_args) { return 404; }
        if ($uri !~ "^/live/[A-Za-z0-9_]{1,24}-[0-9]{8}-[0-9]{6}Z(-[0-9]{1,4})?\z") { return 404; }
        limit_req zone=ants_live_files burst=60 nodelay;
        limit_req_status 503;
        proxy_cache ants_stats_cache;
        proxy_cache_key "ants-live$uri";
        proxy_cache_valid 200 2s;
        proxy_ignore_headers Cache-Control;
        proxy_cache_lock on;
        proxy_cache_use_stale updating;
        error_page 502 504 = @replays_off;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ants_replays ants-server:4020;
        proxy_pass http://$ants_replays;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Connection "close";
        proxy_set_header Host $host;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_hide_header X-Content-Type-Options;
    }

    # The match history that the game server keeps for good (docs/REPLAYS.md "The match history"): the list, GET /history[?filters], and one match, GET /history/<id>, an id of the shape that the replay store's file
    # names make (ants-<MAP>-<date>-<time>Z with a -2, -3 ... when two ended in one second, the recording's name without ".antsrep"; the history decides which exist). The same door of the same server as
    # /replays and /live above (the replay port: read only, no secret; the records hold the names that the players typed and no address, room code or chat), asked the same way: only a GET goes through (405
    # otherwise: the owner's delete is the control interface's and is never offered here), the server's answers pass as they are and a server with no such door is answered 404 with a JSON body (the named location
    # below). What is their own: the LIST takes a query, the filters of the page (limit, offset, sort, format, result, who, rec, color, mode and q; colour= is still accepted as the older spelling of color=, passes the same check and is cached apart, the raw query being the cache key), and the server refuses by name what it does not know with a 400;
    # here only a query of the characters that those words are made of, 400 characters at the most, goes on (a percent escape is allowed, it is the server that reads it), so no other byte reaches the server
    # or the logs. The list WITHOUT a query is cached for five seconds, one entry for everybody, in the cache of the numbers (an old list while a new one is fetched, when the server does not answer and when it says 503, busy: it
    # is a list that grows slowly; the game server does not hold the plain list to its budget of query time); a list WITH a query is cached for five seconds too, an entry for each distinct query, in the history's own small cache, and has the low allowance above; a single match is
    # never cached (made-up ids would fill a cache). The allowances are the zones above (503 beyond), asked after the checks, so that a bad request does not use up the allowance.
    location = /history {
        if ($request_method != GET) { return 405; }
        if ($args !~ "^[A-Za-z0-9_=&%+.-]{0,400}\z") { return 400; }
        limit_req zone=ants_history burst=50 nodelay;
        limit_req zone=ants_history_query burst=5 nodelay;
        limit_req_status 503;
        proxy_cache $history_cache;
        proxy_cache_key "ants-history$is_args$args";
        proxy_cache_valid 200 5s;
        proxy_ignore_headers Cache-Control;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout http_503;
        error_page 502 504 = @replays_off;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ants_replays ants-server:4020;
        proxy_pass http://$ants_replays;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Connection "close";
        proxy_set_header Host $host;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_hide_header X-Content-Type-Options;
    }

    # The sum of the maps of deaths of the matches on one game map (docs/REPLAYS.md "The map of deaths"): GET /history/deaths?map=NAME, the name as a browser writes it (percent escapes and + allowed, 360 characters at
    # most; the game server looks it up among the names of the maps that have positions and answers 404 for any other, and never uses it as a path). An exact location, so that it is no id of the next block
    # (an id begins with ants-). Only a GET and only that one key go through (405 and 400 otherwise, before the allowance and the cache), nothing of the visitor's request is passed on but Host and Connection, the
    # allowance is the zone above (503 beyond), the answer is kept for thirty seconds under its arguments in the history's cache (an old one while a new one is fetched or when the server does not answer).
    location = /history/deaths {
        if ($request_method != GET) { return 405; }
        if ($args !~ "^map=[A-Za-z0-9_%+.()~-]{1,360}\z") { return 400; }
        limit_req zone=ants_history_deaths burst=5 nodelay;
        limit_req_status 503;
        proxy_cache ants_history_cache;
        proxy_cache_key "ants-history-deaths$args";
        proxy_cache_valid 200 30s;
        proxy_ignore_headers Cache-Control;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout http_503;
        error_page 502 504 = @replays_off;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ants_replays ants-server:4020;
        proxy_pass http://$ants_replays;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Connection "close";
        proxy_set_header Host $host;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_hide_header X-Content-Type-Options;
    }

    location ^~ /history/ {
        if ($request_method != GET) { return 405; }
        if ($is_args) { return 404; }
        if ($uri !~ "^/history/ants-[A-Za-z0-9_]{1,24}-[0-9]{8}-[0-9]{6}Z(-[0-9]{1,4})?\z") { return 404; }
        limit_req zone=ants_history_items burst=40 nodelay;
        limit_req_status 503;
        error_page 502 504 = @replays_off;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ants_replays ants-server:4020;
        proxy_pass http://$ants_replays;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Connection "close";
        proxy_set_header Host $host;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_hide_header X-Content-Type-Options;
    }

    # What the six locations above answer when the game server does not offer the replays (it is not there, or it was started without --replay-port): 404 with a JSON body that a page can read
    location @replays_off {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 404 '{"error":"the recorded matches are not offered right now"}';
    }

    # The list of the maps (docs/SERVER.md "The list of maps"): GET /maps -> {"format":1,"maps":[{file,width,height,minutes,players,description,plays,thumb[,original]}]}, the six originals first. It comes from the REPLAY
    # port of the game server like /history (read only, no secret; it holds nothing of a person), asked the same way: a plain GET without a query and nothing else (405 and 404 otherwise, the checks before the
    # allowance), nothing of the visitor's request is passed on but Host and Connection, one entry for everybody in the cache of the numbers for five seconds (an old list while a new one is fetched and when the
    # server does not answer), and a server with no such door is answered 404 with a JSON body (the named location below).
    location = /maps {
        if ($request_method != GET) { return 405; }
        if ($is_args) { return 404; }
        limit_req zone=ants_maps burst=100 nodelay;
        limit_req_status 503;
        proxy_cache ants_stats_cache;
        proxy_cache_key "ants-maps";
        proxy_cache_valid 200 5s;
        proxy_ignore_headers Cache-Control;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        error_page 502 504 = @maps_off;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ants_replays ants-server:4020;
        proxy_pass http://$ants_replays;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Connection "close";
        proxy_set_header Host $host;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_hide_header X-Content-Type-Options;
    }

    # The preview pictures and the level files of the players' maps: static files of the image (/srv/community-maps, outside the web root; Dockerfile). Only a GET or HEAD without a query. The name is checked
    # BEFORE the disk is asked: printable ASCII except the slash and the backslash (a name holds spaces and the characters ! # $ & ' ~; nginx has decoded %XX by then, so an encoded slash or a dot-dot cannot
    # make a path), at most 80 characters, the right ending; anything else is 404. No directory listing. A location that sets a header does not inherit the server's: the three are repeated.
    location ^~ /maps/previews/ {
        if ($request_method !~ "^(GET|HEAD)\z") { return 405; }
        if ($is_args) { return 404; }
        if ($uri !~ "^/maps/previews/[ -.0-\[\]-~]{1,80}\.(webp|png)\z") { return 404; }
        error_page 404 = @approved_files;                                 # (a picture or a file that this folder has not is asked of the game server: the maps that players sent and the owner approved)
        limit_req zone=ants_map_previews burst=400 nodelay;
        limit_req_status 503;
        alias /srv/community-maps/previews/;
        autoindex off;
        types { }
        default_type image/webp;
        add_header Cache-Control "public, max-age=86400";               # (no "always": only a good answer is cacheable, never a 404 or a 403)
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /maps/files/ {
        if ($request_method !~ "^(GET|HEAD)\z") { return 405; }
        if ($is_args) { return 404; }
        if ($uri !~ "^/maps/files/[ -.0-\[\]-~]{1,80}\.(lvl|LVL)\z") { return 404; }
        error_page 404 = @approved_files;
        limit_req zone=ants_map_files burst=40 nodelay;
        limit_req_status 503;
        alias /srv/community-maps/files/;
        autoindex off;
        types { }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=3600";                 # (no "always": only a good answer is cacheable, never a 404 or a 403)
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Everything else under /maps/ (the folder itself, a name of another shape) is a plain 404, never the page of the site
    location ^~ /maps/ {
        return 404;
    }

    # What /maps answers when the game server does not offer the list (it is not there, or it was started without --replay-port): 404 with a JSON body that a page can read
    location @maps_off {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 404 '{"error":"the list of maps is not offered right now"}';
    }

    # The list for the newest version (docs/MAP_SUBMISSIONS.md "The lists"): the same door and the same rules as /maps, its own cache entry. It holds the approved Extended maps too, which /maps never does, so a
    # page or a program of an older version, which asks /maps, never sees one.
    location = /maps/all {
        if ($request_method != GET) { return 405; }
        if ($is_args) { return 404; }
        limit_req zone=ants_maps burst=100 nodelay;
        limit_req_status 503;
        proxy_cache ants_stats_cache;
        proxy_cache_key "ants-list-all";
        proxy_cache_valid 200 5s;
        proxy_ignore_headers Cache-Control;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        error_page 502 504 = @maps_off;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ants_replays ants-server:4020;
        proxy_pass http://$ants_replays;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Connection "close";
        proxy_set_header Host $host;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_hide_header X-Content-Type-Options;
    }

    # The file and the picture of an APPROVED map of the players, asked of the game server's replay door when the folder of the image has none of that name (the two locations above send a 404 here). The name is
    # checked again, nothing of the visitor's request goes on but Host and Connection, and only a GET or HEAD without a query is passed. The game server serves Classic and Extended maps that are approved now, nothing else.
    location @approved_files {
        if ($request_method !~ "^(GET|HEAD)\z") { return 404; }
        if ($is_args) { return 404; }
        if ($uri !~ "^/maps/(files/[ -.0-\[\]-~]{1,80}\.(lvl|LVL)|previews/[ -.0-\[\]-~]{1,80}\.png)\z") { return 404; }
        limit_req zone=ants_map_files burst=40 nodelay;
        limit_req_status 503;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ants_replays ants-server:4020;
        proxy_pass http://$ants_replays;
        proxy_http_version 1.1;
        proxy_method GET;
        proxy_pass_request_headers off;
        proxy_set_header Connection "close";
        proxy_set_header Host $host;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=300";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- The map submissions (docs/MAP_SUBMISSIONS.md) ----
    # The player's calls go to the game server's SUBMISSION door (ants_server --submit-port 4030): POST /submissions (a map, up to 4 MiB: nginx reads the whole body first, so a slow line never holds the game
    # server), GET /submissions (one's own list), GET /submissions/<id>, POST /submissions/<id>/withdraw. The token of a maker travels in the Authorization header; the real client address is passed in
    # X-Client-Address, which the game server believes, so a header that a visitor sends under that name is never passed on (proxy_pass_request_headers is off and the one value is set here).
    # The game server, not this file, applies the limits of the rules (three a day, 200 waiting, the checks of the map).
    location = /submissions {
        access_log /dev/stdout ants_noquery;       # (the address holds the name, the maker and the note)
        if ($request_method !~ "^(GET|POST)\z") { return 405; }
        if ($submit_too_big) { return 413; }
        limit_req zone=ants_submit_post burst=3 nodelay;
        limit_req zone=ants_submit_read burst=20 nodelay;
        limit_req_status 503;
        client_max_body_size 4m;
        client_body_timeout 30s;
        error_page 502 504 = @submit_off;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ants_submit ants-server:4030;
        proxy_pass http://$ants_submit;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Connection "close";
        proxy_set_header Host $host;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
        proxy_set_header X-Client-Address $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Set-Cookie;
    }

    location ^~ /submissions/ {
        access_log /dev/stdout ants_noquery;
        if ($request_method !~ "^(GET|POST)\z") { return 405; }
        if ($uri !~ "^/submissions/[0-9a-f]{32}(/withdraw)?\z") { return 404; }
        if ($is_args) { return 404; }
        limit_req zone=ants_submit_read burst=20 nodelay;
        limit_req_status 503;
        client_max_body_size 1k;
        error_page 502 504 = @submit_off;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ants_submit ants-server:4030;
        proxy_pass http://$ants_submit;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Connection "close";
        proxy_set_header Host $host;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
        proxy_set_header X-Client-Address $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Set-Cookie;
    }

    # What the submission paths answer when the game server does not offer them (it is not there, or was started without --submit-port)
    location @submit_off {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 503 '{"error":"submissions_off","message":"Sending maps is not switched on right now."}';
    }

    # ---- The test maps (docs/MAP_SUBMISSIONS.md "Test maps") ----
    # POST /test-maps is the Map Maker's "With other players": a draft map for a room of the player's own. It goes to the game server's TEST-MAP door (ants_server --test-map-port 4031, on by default in the stack
    # files), a door that has no database, no accounts and no other route, so this block cannot reach the submissions or the owner's calls whatever happens to it. Nothing the visitor sent goes on but the type of the
    # body, Sec-Fetch-Site and the real client address (X-Client-Address, which the game server believes: a header of that name from a visitor is never passed on); the path that goes on is always exactly /test-maps.
    # The name is in the query, so the log has the format without it. A game server that is not there, or runs with ANTS_TEST_MAP_PORT=0, is answered 503 test_maps_off (JSON), never a page of the site.
    location = /test-maps {
        access_log /dev/stdout ants_noquery;       # (the address holds the name of the map)
        if ($request_method != POST) { return 405; }
        limit_req zone=ants_test_maps burst=3 nodelay;
        limit_req_status 503;
        client_max_body_size 2m;
        client_body_timeout 30s;
        error_page 502 504 = @test_maps_off;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ants_test_maps ants-server:4031;
        proxy_pass http://$ants_test_maps$uri$is_args$args;       # (the normalized path, never the raw request line)
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Connection "close";
        proxy_set_header Host $host;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
        proxy_set_header X-Client-Address $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Set-Cookie;
    }

    # What /test-maps answers when the game server does not offer the door (it is not there, or ANTS_TEST_MAP_PORT is 0)
    location @test_maps_off {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 503 '{"error":"test_maps_off","message":"Test rooms are not switched on right now."}';
    }

    # ---- The owner's page (docs/MAP_SUBMISSIONS.md "The owner's page") ----
    # Reached only by typing /admin: nothing on the site links to it. The page is a static file that holds nothing private (a visitor who opens it sees the sign-in box and nothing else); what it
    # shows comes from /admin/api, which only the owner's cookie opens. The page has a strict content security policy (no inline script or style, no other site, no frame) and is never kept by a cache.
    location = /admin {
        if ($request_method !~ "^(GET|HEAD)\z") { return 405; }
        root /usr/share/nginx/html;
        try_files /admin.html =404;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # (the file itself is not a second way in: the page is /admin)
    location = /admin.html {
        return 404;
    }

    location = /admin/ {
        return 301 /admin;
    }

    # The owner's API: the game server's submission door. A visitor gets the answer of a path that does not exist (the game server decides from the cookie); only the cookie, the CSRF token and the type of the body
    # go on. The game server sets the sign-in cookie itself (POST /admin/api/login, the password change and the sign-out are the calls that carry a Set-Cookie back), so that header is passed. The body of a
    # sign-in holds a password: it goes to the game server and nowhere else (nginx's access log holds the request line only). The sign-in has its own allowance of six a minute for each address.
    location ^~ /admin/api/ {
        access_log /dev/stdout ants_noquery;       # (a decline reason or a name can be in the address)
        if ($request_method !~ "^(GET|POST)\z") { return 405; }
        # (the decoded and normalized path is what goes on upstream, so only plain characters may be in it)
        if ($uri !~ "^/admin/api/[A-Za-z0-9/_-]{0,120}\z") { return 404; }
        limit_req zone=ants_admin_api burst=200 nodelay;
        limit_req zone=ants_admin_login burst=5 nodelay;
        limit_req_status 503;
        client_max_body_size 8k;
        error_page 502 504 = @submit_off;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ants_submit ants-server:4030;
        proxy_pass http://$ants_submit$uri$is_args$args;       # (the normalized path, never the raw request line)
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Connection "close";
        proxy_set_header Host $host;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Ants-Csrf $http_x_ants_csrf;
        proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
        proxy_set_header X-Client-Address $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_hide_header X-Content-Type-Options;
    }

    # Everything else under /admin/ is a plain 404, never the page of the site
    location ^~ /admin/ {
        return 404;
    }

    location = /favicon.ico {
        root /usr/share/nginx/html;
        try_files /favicon.ico /favicon.png =204;
        add_header Cache-Control "public, max-age=2592000";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /favicon.png {
        root /usr/share/nginx/html;
        try_files /favicon.png /favicon.ico =204;
        add_header Cache-Control "public, max-age=2592000";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The front page. "/" is the lobby (lobby.html: a room on the game server that is ready when the page opens, a link to send, START; a game on this computer when nobody else is in it), EXCEPT for the addresses of the GAME page itself:
    # every address that a game was ever opened at has ?join= (a match on the game server), and those keep opening the game page (index.html), as "/" always did.
    # The rewrite is internal (the address stays), and the answer is that of the html block below: its revalidation header, the cross-origin headers and the ETag (a conditional request is answered 304
    # as for any page). tests/scripts/web_routes_check.py asks every one of these routes of a running nginx.
    location = / {
        set $ants_front /lobby.html;
        if ($arg_join != "") { set $ants_front /index.html; }
        rewrite ^ $ants_front last;
    }

    # The Play online page of the first versions is the front page now: its address goes there for good, with the same query (?room=, ?aspect=)
    location = /four.html {
        return 301 /$is_args$args;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Audio & media files: caching
    location ~* \.(wav|mp3|ogg)$ {
        add_header Cache-Control "public, max-age=604800, no-transform";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|bmp)$ {
        add_header Cache-Control "public, max-age=604800, no-transform";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The game (index.wasm, index.data, index.html, index.js) and the pages' styles and scripts: every use is revalidated (AGENTS.md rule 6), and ONLY that:
    # Cache-Control "no-cache, must-revalidate". The browser keeps the file and asks again with If-None-Match: a build that has not changed answers 304 and nothing is downloaded
    # again (about 9 MB on the wire), a new build has another ETag and is fetched at once, so nobody runs a stale binary. So: the ETag stays switched on; the header never forbids
    # storing (a response that may not be stored cannot be revalidated, and every reload downloaded it all); and there is no expires directive (nginx would add its own second
    # Cache-Control line, "no-cache", and an Expires date).
    # (A location that has an add_header of its own does not inherit the server's, so the three security headers of the server are repeated in each of these blocks.)

    # WASM files: explicit MIME type, revalidation and security headers
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Data package: explicit MIME type, revalidation and security headers
    location ~* \.data$ {
        default_type application/octet-stream;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The map maker's page (docs/MAP_EDITOR.md): the same headers as any page, and a content security policy that lists what the page does: scripts and the map core's WebAssembly from this site only (no inline
    # script, no eval), the page's style attributes (style-src 'unsafe-inline'), images from this site and the data and blob addresses that the drawing and the downloads make, requests to this site only,
    # no plug-in, no base address, and no frame around it (a frame could put the Submit button under a click). The referrer is not sent. The page's scripts and style files are served by the block below.
    location = /mapmaker.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(html|css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
