# One request a second per client address for the status answer of the game server (/busy, below); a flood is answered 503 and never reaches the server
limit_req_zone $binary_remote_addr zone=ants_busy:1m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name beta.playants.org localhost;

    root /usr/share/nginx/html;
    index index.html;


    # Gzip compression for WebAssembly, JS, and game asset bundles
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/wasm
        application/octet-stream;

    # WebAssembly & modern browser security headers
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Avoid schema or port mismatch when behind reverse proxy
    absolute_redirect off;

    location = /catalog {
        return 301 /asset_catalog/;
    }

    location = /viewer {
        return 301 /asset_catalog/;
    }

    location = /asset_catalog {
        return 301 /asset_catalog/;
    }

    location = /changelog {
        return 301 /changelog.html;
    }

    # Every Cache-Control of this file is written out with add_header and no `expires` directive: `expires` makes nginx add a Cache-Control line of its own, and a second one
    # followed from the add_header (two headers on favicon.png, the sprites, the sounds and the images)

    # Direct fallback aliases for /sprites/ and /sounds/
    location ^~ /sprites/ {
        alias /usr/share/nginx/html/asset_catalog/sprites/;
        add_header Cache-Control "public, max-age=604800, no-transform" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    location ^~ /sounds/ {
        alias /usr/share/nginx/html/asset_catalog/sounds/;
        add_header Cache-Control "public, max-age=604800, no-transform" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # Asset Catalog sprites & sounds caching within /asset_catalog/
    location ^~ /asset_catalog/sprites/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800, no-transform" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    location ^~ /asset_catalog/sounds/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800, no-transform" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # Asset Catalog & Viewer: Use ^~ to prevent regular expression interception
    location ^~ /asset_catalog/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The game server's WebSocket door (ants_server --ws-port 4002, docs/NETWORK_PORT.md): the game pages connect to wss://<this host>/ws.
    # The server runs in its own container (docker-compose.server.yml, service "ants-server" on the same network). The name is resolved when a request
    # comes (Docker's own resolver), so this container starts, and the rest of the site works, whether or not the server is there (502 until it is).
    location = /ws {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ants_server ants-server:4002;
        proxy_pass http://$ants_server;
        proxy_http_version 1.1;                                   # the upgrade needs HTTP/1.1 to the backend
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;                                 # a quiet game is not a dead one (the default is 60 s)
        proxy_send_timeout 3600s;
    }

    # The game server's public, read-only status (ants_server's GET /busy on its WebSocket port): {"matches": N, "players": M}, plain counts, no names, no codes. The deploy job of CI polls it
    # and restarts the site when no match runs (docs/WORKFLOW.md). Like /ws it goes to the WebSocket port of the server, but as a plain GET and nothing else: any other method is 405, a query
    # is 404 (the status takes no parameter), nothing of the request body or of an upgrade is passed on, and the answer is never cached (the server's own Cache-Control: no-store passes through; add_header here would make it two lines).
    location = /busy {
        if ($request_method != GET) { return 405; }
        if ($is_args) { return 404; }
        limit_req zone=ants_busy burst=5 nodelay;
        limit_req_status 503;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ants_server ants-server:4002;
        proxy_pass http://$ants_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "close";
        proxy_set_header Host $host;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_hide_header X-Content-Type-Options;                 # (the server's own nosniff line is the one that this block inherits: not twice)
    }

    location = /favicon.ico {
        root /usr/share/nginx/html;
        try_files /favicon.ico /favicon.png =204;
        add_header Cache-Control "public, max-age=2592000";
    }

    location = /favicon.png {
        root /usr/share/nginx/html;
        try_files /favicon.png /favicon.ico =204;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Audio & media files: caching
    location ~* \.(wav|mp3|ogg)$ {
        add_header Cache-Control "public, max-age=604800, no-transform";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|bmp)$ {
        add_header Cache-Control "public, max-age=604800, no-transform";
    }

    # The game (index.wasm, index.data, index.html, index.js) and the pages' styles and scripts: every use is revalidated (AGENTS.md rule 6), and ONLY that:
    # Cache-Control "no-cache, must-revalidate". The browser keeps the file and asks again with If-None-Match: a build that has not changed answers 304 and nothing is downloaded
    # again (about 9 MB on the wire), a new build has another ETag and is fetched at once, so nobody runs a stale binary. So: the ETag stays switched on; the header never forbids
    # storing (a response that may not be stored cannot be revalidated, and every reload downloaded it all); and there is no expires directive (nginx would add its own second
    # Cache-Control line, "no-cache", and an Expires date).
    # (A location that has an add_header of its own does not inherit the server's, so the two cross-origin headers of the server are repeated in each of these blocks.)

    # WASM files: explicit MIME type, revalidation and security headers
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # Data package: explicit MIME type, revalidation and security headers
    location ~* \.data$ {
        default_type application/octet-stream;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    location ~* \.(html|css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }
}
