# The reverse proxies in front of this site whose X-Forwarded-For may be believed (nginx.conf includes this file; docs/MAP_SUBMISSIONS.md "Deploying").
# Empty is right when visitors reach this container directly: the address of the connection is then the visitor's.
#
# Behind a proxy, name it here (mount your own file over /etc/nginx/ants-trusted-proxies/proxies.conf of the web container), for example:
#   set_real_ip_from 172.18.0.0/16;
#   real_ip_header X-Forwarded-For;
#   real_ip_recursive on;
# Without it every visitor has the proxy's address, and the limit of three maps a day for each address becomes three for the whole site.
