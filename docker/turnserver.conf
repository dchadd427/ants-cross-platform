# The relay of the players' channels (docs/SERVER.md "The relay for the players' channels", docs/P2P_HINTS.md): coturn in shared-secret mode, the image of Dockerfile.turn.
# Nothing secret and no address is in this file: the shared secret, the public address and the realm (the relay's DNS name) come on the command line from the stack's environment
# (docker-compose.stack.yml: ANTS_TURN_SECRET, ANTS_TURN_EXTERNAL_IP, ANTS_TURN_HOST). Tested with coturn/coturn 4.19.2, the official image.
# coturn takes no comment after a value: every comment is on a line of its own.

# --- where it listens: ONE port (UDP and TCP) and the relay range below, nothing else ---
# The listening port is not in this file. The entry point (docker/turn-entrypoint.sh) puts it on the command line from ANTS_TURN_PORT (3478 when that is not set): the one home of the number, which the
# stack also gives to the game server and the health check. Host networking means that a second TURN server on the same machine meets every port of this one, so each other port coturn knows is off:
#   the TLS and DTLS listeners (5349, alternative 5350): off by `no-tls` (DTLS starts only with `dtls`, which nothing here sets)
#   the RFC 5780 alternative listener (the listening port + 1): off by `no-rfc5780` (the default of coturn 4.19, kept here by name so that it stays off)
#   the CLI (5766; coturn 4.19 starts it only with `cli`, and the old `no-cli` is deprecated and logs an error), the web admin (8080, `web-admin`) and the metrics (9641, `prometheus`): off by default,
#   and never switched on here or on the command line (tests/scripts/test_turn_relay.py holds the list).
no-rfc5780
# no TLS yet (UDP and TCP on the listening port reach nearly every network). To add TURN over TLS for networks that let only 443 or 5349 through: delete the next line, uncomment the block below, mount a
# certificate and its key, and open 5349 (TCP and UDP) on the host (and pick a TLS port that no other TURN server on the machine holds).
no-tls
#tls-listening-port=5349
#cert=/certs/fullchain.pem
#pkey=/certs/privkey.pem
#no-tlsv1
#no-tlsv1_1
# 200 relay ports = at most 200 relayed sessions at a time (a connection between two players takes two from each of them: one over UDP, one over TCP)
min-port=49160
max-port=49359

# --- who may use it: only a holder of a short-lived credential that the game server made from the shared secret ---
# username = <expiry unix time>:<random label>, password = base64(HMAC-SHA1(secret, username))
use-auth-secret
fingerprint
# the relay carries UDP to the other player only (a client may still reach the relay itself over TCP)
no-tcp-relay
no-multicast-peers
allocation-default-address-family=ipv4
# the old MAPPED-ADDRESS and the software banner are already off by default in 4.19

# --- never relay to an address that is not a player's public address ---
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# --- quotas ---
# relayed sessions per credential at the same time: a player's browser asks the relay for up to two (one over UDP, one over TCP) for each connection to another player, and a four-player match has three
# connections for each player, so six. A player that is refused one of them still connects with the other; the game server makes at most two credentials for a player in a match.
user-quota=6
# relayed sessions in all
total-quota=200
# bytes a second for one session (a match needs about 2,000)
max-bps=32000
# bytes a second for the whole relay (about 12 Mbit/s)
bps-capacity=1500000
stale-nonce=600

# --- logs: standard output (docker rotates them); they hold player addresses and the credentials' random labels, so keep them short-lived ---
log-file=stdout
simple-log
