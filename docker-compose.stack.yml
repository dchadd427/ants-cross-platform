# The whole site in one stack: the web game (ants-beta) and the dedicated game server (ants-server). The values below are set
# in the stack's "Environment variables" (they are NOT part of the repository):
#
#   ANTS_SERVER_SECRET=<a long random secret>       the bearer secret of the control interface (optional: without it the server makes one the first time it
#                                                   starts, prints it once in its log and keeps it in the file /results/control-secret of the volume
#                                                   ants-server-results: docker exec ants-server cat /results/control-secret)
#   ANTS_MAPS_DIR=/path/on/the/host/to/the/maps     a folder of .lvl files that rooms may use instead of the six maps of the original game (optional; without it
#                                                   the server uses the volume "ants-maps", which is filled from the image the first time: to refresh it after an
#                                                   update that changes those six, remove that volume; to add maps, copy them into it. The players' maps are not in this volume: the image holds them in /community-maps
#                                                   and the server lists them, GET /maps)
#   ANTS_PORT=19980                                 the host port of the web page (optional)
#   ANTS_TRUSTED_PROXIES_FILE=/path/on/the/host/proxies.conf    a list of reverse proxies of your own (optional). Without it the web image's list is used, which trusts a reverse proxy that connects from a private
#                                                   address (docs/SERVER.md "Behind a reverse proxy"); set this only for a proxy that connects from a PUBLIC address, or to name your proxy exactly. The file REPLACES the image's list: copy
#                                                   docker/trusted-proxies.conf and change it. Give the FULL path of a file on the host: a relative path does not work in a stack that a deployment tool builds from a repository, whose files are not on the host.
#                                                   The path must name an existing FILE: for a path that does not exist Docker makes a directory there and nginx stops with "Is a directory"
#   ANTS_WEB_BIND_PREFIX=127.0.0.1:                 put in front of the host port of the web page (optional; empty by default: the port is published as before). An address of this machine and a colon, such as 127.0.0.1:,
#                                                   publishes it on that address only, so a reverse proxy on another machine, or one that reaches this machine by its public address, would no longer reach it (docs/SERVER.md "Behind a reverse proxy")
#   ANTS_SERVER_PORT=4001                           the public TCP game port of native clients (optional; the browser page does not use it)
#   ANTS_BUILD_ID=<text>                            which build this is (the page's footer, the changelog pages, `ants_server --version`); optional: without it the images
#                                                   take the commit that the clone's .git/HEAD and .git/refs name, and the UTC build time when the clone has no such files
#   ANTS_DEMO_ROOMS=48 ANTS_DEMO_MAP=TREASURE.LVL   how many demo rooms the page web/lobby.html may make at a time, and the map of a room whose create block names none
#                                                   (optional; TREASURE.LVL, the map that is played most, is the default). ANTS_DEMO_ROOMS must be 1 to 255: 0, or
#                                                   256 and more, make the server exit at its start, and with restart: unless-stopped it then restarts again and
#                                                   again. There is no variable that switches the demo rooms off: delete the three demo options from the command
#                                                   below (in your copy of this file).
#   ANTS_DEMO_MAPS=TINY.LVL,SMALL.LVL,...           the maps a room code may choose (the six maps of the original game by default, which the page offers; comma
#                                                   separated, blanks around a name are dropped; every one must be in the maps folder, or the server stops at startup)
#   ANTS_REPLAY_DAYS=30 ANTS_REPLAY_MAX_MB=100      how long the server keeps the recorded matches (1 to 3650 days) and how much room they may take together (1 to 4096 MiB; the oldest go first past it). They are
#                                                   in the folder replays of the volume ants-server-results, next to the control secret and the restart records, so the server also stops keeping
#                                                   matches when the disk has less than 256 MiB free. A match is kept when it ran 30 seconds or more, however it ended, the games of the front page (demo
#                                                   rooms) included. A value out of range makes the server exit at its start, and with restart: unless-stopped it then restarts again and again
#                                                   (docs/REPLAYS.md "On the game server")
#   ANTS_REPLAY_PORT=4020                           the port, inside the container, where the server answers GET /replays and GET /replays/<file> for the site's nginx: the list and the files of the
#                                                   recorded matches are PUBLIC here, read only, with no secret. They hold the names that the players typed (plain ASCII, 32 characters at most; a
#                                                   player with no name shows as a color, a computer player as "Bot (Medium)"), so everybody can read those names; no address, room code or chat is
#                                                   in them. The port is not published on the host. Leave it at 4020, the one that docker/nginx.conf passes to, or set 0, which switches the public
#                                                   list off. Any other number leaves the server listening where nginx does not look, and the site answers 404 for both addresses as if the list
#                                                   were off.
#   ANTS_BOT_MATCH_EVERY_MIN=60                     minutes between two matches of computer players that the game server plays itself (5 to 1440; 0 plays none): two to four standard bots on a random
#                                                   map, at the normal speed (6 to 12 minutes), so that the site's list of matches that are being played always has one to watch and the match is kept
#                                                   as a replay afterwards. A value out of range makes the server exit at its start (see ANTS_REPLAY_DAYS). The first match begins a minute after the
#                                                   server starts. (docs/SERVER.md "Matches of computer players")
#   ANTS_SUBMIT_PORT=0                              the port, inside the container, of the map submissions' door (docs/MAP_SUBMISSIONS.md): 0 = OFF, the default. Set 4030, the one that docker/nginx.conf
#                                                   passes /submissions and /admin/api to, to switch it on; it needs the database. Not published on the host. The maps wait in the folder submissions of the volume
#                                                   ants-server-results, and the database ants.db there grows to schema version 6 (a program of an older version refuses that file: keep a copy of ants.db before the first start)
#   ANTS_TEST_MAP_PORT=4031                         the port, inside the container, of the TEST-MAP door (docs/MAP_SUBMISSIONS.md, "Test maps"): ON by default. The Map Maker's "With other players" sends its draft map
#                                                   to POST /test-maps, which docker/nginx.conf passes here; it works with the submissions door OFF (it has no database, no accounts and no other route). Leave it at
#                                                   4031, the one that nginx passes to, or set 0, which switches test rooms off (the site then says so). Not published on the host. The maps live in the folder test-maps of the
#                                                   volume ants-server-results (at most 64 MiB, 6 hours each) and are wiped at every start.
#   ANTS_ADMIN_SESSION_SECRET=<32+ characters>      the secret that signs the sign-in cookie of the admin page (a long random text: openssl rand -hex 32). Without it every /admin/api path answers 404.
#                                                   The accounts are made on the server, not here: docs/MAP_SUBMISSIONS.md, "Deploying" (docker exec -it ants-server ants_server --admin-create <username> --db /results/ants.db)
#
#   ANTS_HUB_PUBLIC_URL=https://beta.playants.org   the chat hub (service ants-hub, docs/HUB.md): the address of this site, the one Origin that a chat socket may come from, and the base of the Discord login's way back
#                                                   (<this address>/hub/callback; optional; this is the default). Empty or wrong: the hub refuses every socket and the page says "Chat is offline"
#   ANTS_HUB_DISCORD_CLIENT_ID, ANTS_HUB_DISCORD_CLIENT_SECRET    the Discord application of the chat's login (docs/HUB.md, "Login": the site's operator makes the application, adds the redirect
#                                                   <this address>/hub/callback, and puts the id and the secret here). BOTH come from this stack's environment and never from a file of
#                                                   the repository; without them the chat is read-only for everybody and says so. The secret is read by the hub and printed nowhere
#   ANTS_HUB_MIN_ACCOUNT_DAYS=7                     a Discord account younger than this many days cannot write in the chat (0 lets every account write; optional; this is the default)
#   ANTS_HUB_DISCORD_BOT_TOKEN, ANTS_HUB_DISCORD_GUILD, ANTS_HUB_ROLE_ADMIN, ANTS_HUB_ROLE_MOD    who may moderate the chat: the hub asks the site's Discord server, with the bot's token, which
#                                                   roles a logged-in person holds (docs/HUB.md, "Roles"): the server's id and the two roles' ids. ALL come from this stack's environment and never
#                                                   from a file of the repository; the token is read by the hub and printed nowhere. Without them nobody moderates in the chat (optional)
#   ANTS_HUB_ROLE_RECHECK_SECONDS=180               how often the role of everybody who is in the chat is asked again, 60 to 3600 (optional; this is the default)
#   ANTS_HUB_OWNER=<account id>                     one account (Discord's id, digits only) that is always an administrator, even when Discord does not answer (optional; none by default).
#                                                   Moderation from a terminal: docker exec ants-hub python -m hub.admin list
#
# Only the TCP game port is open to other machines. The WebSocket port (the site's nginx passes /ws to it over the network below) and the control
# interface (the lobby's backend calls it) are published on the host's loopback address only.
# The replay port (the site's nginx passes /replays to it over the network below) is not published on the host at all. The services on the network below trust each other, so put only containers you trust on it (the stack's services and the proxy). The chat hub (port 4040, not published) is on it too: the site's nginx passes /hub/ws to it.
services:
  ants-beta:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # optional: which build this is (page footer, --version); without it the image takes the commit from the clone's .git files, else the build time
        ANTS_BUILD_ID: ${ANTS_BUILD_ID:-}
    container_name: ants-beta
    restart: unless-stopped
    # A list of reverse proxies of your own (ANTS_TRUSTED_PROXIES_FILE, see the header), or nothing: /dev/null is an empty file, which changes nothing (the web image's list is used). The path must name an existing FILE:
    # for a path that does not exist Docker makes a directory there and nginx stops with "Is a directory". The image's list names a reverse proxy at a private address, so that the limits per address (map sends,
    # sign-in tries, map files) count each visitor's own address; a proxy at a public address goes in a list of your own.
    volumes:
      - ${ANTS_TRUSTED_PROXIES_FILE:-/dev/null}:/etc/nginx/ants-trusted-proxies.d/own.conf:ro
    ports:
      - "${ANTS_WEB_BIND_PREFIX:-}${ANTS_PORT:-19980}:80"
    networks:
      - proxy-network
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256

  ants-server:
    build: &server-build
      context: .
      dockerfile: Dockerfile.server
      args:
        # optional: which build this is (page footer, --version); without it the image takes the commit from the clone's .git files, else the build time
        ANTS_BUILD_ID: ${ANTS_BUILD_ID:-}
    container_name: ants-server
    restart: unless-stopped
    # waits for the one-shot helper below (it must have exited with 0: it always does)
    depends_on:
      ants-results-init:
        condition: service_completed_successfully
    # A stop (a redeploy recreates the container) gives the server this long before docker kills it. The server needs a moment only: on SIGTERM it makes the restart records of its running
    # rooms durable (one fsync a room, a few milliseconds) and exits; the records stay in /results/restart of the volume below, and the server that starts again brings the matches back
    # (docs/NETWORK_PORT.md "Restart records"; only rooms that hold seats keep a record: every room of this server does, unless it is started with --no-reconnect). 15 s is the default 10 s and room for a slow volume: 256 rooms at 30 ms for a flush are 7.7 s. KEEP THE
    # VOLUME ants-server-results: a stack that is removed with its volumes loses the records.
    stop_grace_period: 15s
    # The page web/lobby.html (the front page) makes rooms of its own: its Hello carries a create block (the map, the seats, the teams) and a code of six lower-case letters and digits: demo rooms are ON here, at most ANTS_DEMO_ROOMS at a time
    # (default 48) on the map ANTS_DEMO_MAP (default TREASURE.LVL) unless the block names one of ANTS_DEMO_MAPS (the page's choice; the maps folder must hold them
    # all). A code with an upper-case letter makes no such room (the control interface draws those). Demo rooms are open to anyone who can reach a game port (the site, or TCP port 4001), so their number is bounded; rooms of the control interface keep their own places.
    # ANTS_DEMO_ROOMS is 1 to 255 (see the header). To switch them off, delete the three demo options. A demo room waits ten minutes for its players; its first player can start it earlier with START (two players at least, or one alone with bots).
    # --log-mb 4: one room's turn log (what a returning player is given) is at most 4 MiB (a busy 30-minute match logs 0.65 MB), so that the demo rooms alone cannot use up the 256 MiB that
    # all the logs share (docs/NETWORK_PORT.md). Keep ANTS_DEMO_ROOMS times --log-mb under 256 (tests/scripts/test_default_map.py checks it).
    # Replays: a match that ran 30 seconds or more is kept for ANTS_REPLAY_DAYS days (default 30), all of them together at most ANTS_REPLAY_MAX_MB MiB (100), in /results/replays; --replay-demo keeps the
    # matches of the demo rooms too (the front page's games). --replay-port opens the PUBLIC, read-only door of the list and the files (GET /replays, GET /replays/<file>; the site's nginx passes both to it
    # over the network below): ON here, with the port that docker/nginx.conf uses; ANTS_REPLAY_PORT=0 switches it off. The program's own default is off.
    # The files and the list hold the names that the players typed (a player with no name shows as a color), so those names are public here; no address, room code or chat is in them.
    command: ["--port", "4001", "--ws-port", "4002", "--ctl-port", "4010", "--demo-rooms", "${ANTS_DEMO_ROOMS:-48}", "--demo-map", "${ANTS_DEMO_MAP:-TREASURE.LVL}", "--demo-maps", "${ANTS_DEMO_MAPS:-TINY.LVL,SMALL.LVL,MEDIUM.LVL,GAUNTLET.LVL,TREASURE.LVL,ISLANDS.LVL}", "--log-mb", "4", "--bot-match-every-min", "${ANTS_BOT_MATCH_EVERY_MIN:-60}", "--submit-port", "${ANTS_SUBMIT_PORT:-0}", "--test-map-port", "${ANTS_TEST_MAP_PORT:-4031}", "--replay-demo", "--replays-days", "${ANTS_REPLAY_DAYS:-30}", "--replays-max-mb", "${ANTS_REPLAY_MAX_MB:-100}", "--replay-port", "${ANTS_REPLAY_PORT:-4020}"]
    environment:
      ANTS_SERVER_SECRET: ${ANTS_SERVER_SECRET:-}
      # the admin page (docs/MAP_SUBMISSIONS.md): the secret that signs the sign-in cookie; without it every /admin/api path answers 404
      ANTS_ADMIN_SESSION_SECRET: ${ANTS_ADMIN_SESSION_SECRET:-}
    volumes:
      - ${ANTS_MAPS_DIR:-ants-maps}:/maps:ro
      - ants-server-results:/results
    ports:
      - "${ANTS_SERVER_PORT:-4001}:4001"
      - "127.0.0.1:${ANTS_SERVER_WS_PORT:-4002}:4002"
      - "127.0.0.1:${ANTS_SERVER_CTL_PORT:-4010}:4010"
    networks:
      - proxy-network
    # the program needs nothing but its sockets and the results folder
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64

  # One-shot helper of ants-server: before each start of the server it makes the TOP folder /results of the volume ants-server-results belong to the user ants (the user that the server runs as, made in
  # Dockerfile.server). A volume that was made before the image gave /results to ants keeps its old owner (root), and the server, which is not root, then cannot write /results/<room>.json. Only /results itself is
  # changed (chown without -R: no file or folder below it is touched). When the owner is already ants it prints that and does nothing; a failed or slow chown (timeout 20) prints one line and the helper
  # ALWAYS exits 0, so it never keeps the server from starting. It runs as root with one capability (CHOWN), no network, a read-only root file system and no ports; the server keeps its own user and
  # its own limits. It uses the image of the server (the same build) so that the user ants exists for it and a NEW volume is filled from the image's /results, which belongs to ants. The entrypoint of the
  # image is replaced by a shell. In a compose file "$$" is a single "$" for the shell.
  ants-results-init:
    build: *server-build
    container_name: ants-results-init
    restart: "no"
    user: "0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["if [ \"$$(stat -c %U /results)\" = ants ]; then echo \"ants-results-init: /results already belongs to ants, nothing to do\"; else timeout 20 chown ants: /results && echo \"ants-results-init: /results now belongs to ants\" || echo \"ants-results-init: could not change the owner of /results, left as it is\"; fi; exit 0"]
    volumes:
      - ants-server-results:/results
    network_mode: none
    healthcheck:
      disable: true
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 16

  # The global chat (docs/HUB.md): wss://<site>/hub/ws, passed by the page's nginx over the network above (port 4040, not published on the host). The site starts and works without it (nginx finds it by name
  # when a request comes; "Chat is offline" until it is there). Its database (the chat lines of the last 7 days, mutes and bans) is the volume ants-hub-data: keep it. No ANTS_BUILD_ID: a deploy that
  # changes nothing in hub/ builds the same image, and the chat is not restarted. Reading is open to everybody; writing needs the Discord login, which is on only where the two settings of the application
  # are given (the hub then also needs to reach discord.com over https: the network below lets it out).
  ants-hub:
    build:
      context: .
      dockerfile: Dockerfile.hub
    container_name: ants-hub
    restart: unless-stopped
    environment:
      ANTS_HUB_PUBLIC_URL: ${ANTS_HUB_PUBLIC_URL:-https://beta.playants.org}
      ANTS_HUB_DISCORD_CLIENT_ID: ${ANTS_HUB_DISCORD_CLIENT_ID:-}
      ANTS_HUB_DISCORD_CLIENT_SECRET: ${ANTS_HUB_DISCORD_CLIENT_SECRET:-}
      ANTS_HUB_MIN_ACCOUNT_DAYS: ${ANTS_HUB_MIN_ACCOUNT_DAYS:-7}
      ANTS_HUB_DISCORD_BOT_TOKEN: ${ANTS_HUB_DISCORD_BOT_TOKEN:-}
      ANTS_HUB_DISCORD_GUILD: ${ANTS_HUB_DISCORD_GUILD:-}
      ANTS_HUB_ROLE_ADMIN: ${ANTS_HUB_ROLE_ADMIN:-}
      ANTS_HUB_ROLE_MOD: ${ANTS_HUB_ROLE_MOD:-}
      ANTS_HUB_ROLE_RECHECK_SECONDS: ${ANTS_HUB_ROLE_RECHECK_SECONDS:-180}
      ANTS_HUB_OWNER: ${ANTS_HUB_OWNER:-}
    volumes:
      - ants-hub-data:/data
    networks:
      - proxy-network
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 192m
    tmpfs:
      - /tmp
    # the hub writes a few lines for each connection: the log is kept small (docker's own default keeps all of it)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ants-server-results:
  ants-maps:
  ants-hub-data:

networks:
  proxy-network:
    external: true
