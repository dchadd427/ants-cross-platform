# The whole site in one stack: the web game (ants-beta) and the dedicated game server (ants-server). For Portainer: Stacks -> Add stack -> Repository,
# compose path "docker-compose.stack.yml"; the values below are set in the stack's "Environment variables" (they are NOT part of the repository):
#
#   ANTS_SERVER_SECRET=<a long random secret>       the bearer secret of the control interface (optional: without it the server makes one the first time it
#                                                   starts, prints it once in its log and keeps it in the file /results/control-secret of the volume
#                                                   ants-server-results: docker exec ants-server cat /results/control-secret)
#   ANTS_MAPS_DIR=/path/on/the/host/to/the/maps     a folder of .lvl files that rooms may use instead of the six maps of the original game (optional; without it
#                                                   the server uses the volume "ants-maps", which is filled from the image the first time: to refresh it after an
#                                                   update that adds maps, remove that volume; to add maps, copy them into it)
#   ANTS_PORT=19980                                 the host port of the web page (optional)
#   ANTS_SERVER_PORT=4001                           the public TCP game port of native clients (optional; the browser page does not use it)
#   ANTS_BUILD_ID=<text>                            which build this is (the page's footer, the changelog pages, `ants_server --version`); optional: without it the images
#                                                   take the commit that the clone's .git/HEAD and .git/refs name, and the UTC build time when the clone has no such files
#   ANTS_DEMO_ROOMS=48 ANTS_DEMO_MAP=TREASURE.LVL   how many demo rooms the page web/lobby.html may make at a time, and the map of a room whose code names none
#                                                   (optional; TREASURE.LVL, the map that is played most, is the default). ANTS_DEMO_ROOMS must be 1 to 255: 0, or
#                                                   256 and more, make the server exit at its start, and with restart: unless-stopped it then restarts again and
#                                                   again. There is no variable that switches the demo rooms off: delete the three demo options from the command
#                                                   below (in your copy of this file).
#   ANTS_DEMO_MAPS=TINY.LVL,SMALL.LVL,...           the maps a room code may choose (the six maps of the original game by default, which the page offers; comma
#                                                   separated, blanks around a name are dropped; every one must be in the maps folder, or the server stops at startup)
#   ANTS_REPLAY_DAYS=30 ANTS_REPLAY_MAX_MB=100      how long the server keeps the recorded matches (1 to 3650 days) and how much room they may take together (1 to 4096 MiB; the oldest go first past it). They are
#                                                   in the folder replays of the volume ants-server-results, next to the control secret and the restart records, so the server also stops keeping
#                                                   matches when the disk has less than 256 MiB free. A match is kept when it ran 30 seconds or more, however it ended, the games of the front page (demo
#                                                   rooms) included. A value out of range makes the server exit at its start, and with restart: unless-stopped it then restarts again and again
#                                                   (docs/REPLAYS.md "On the game server")
#   ANTS_REPLAY_PORT=4020                           the port, inside the container, where the server answers GET /replays and GET /replays/<file> for the site's nginx: the list and the files of the
#                                                   recorded matches are PUBLIC here, read only, with no secret. They hold the names that the players typed (plain ASCII, 32 characters at most; a
#                                                   player with no name shows as a colour, a computer player as "Bot (Medium)"), so everybody can read those names; no address, room code or chat is
#                                                   in them. The port is not published on the host. Leave it at 4020, the one that docker/nginx.conf passes to, or set 0, which switches the public
#                                                   list off. Any other number leaves the server listening where nginx does not look, and the site answers 404 for both addresses as if the list
#                                                   were off.
#
# Only the TCP game port is open to other machines. The WebSocket port (the site's nginx passes /ws to it over the network below) and the control
# interface (the lobby's backend calls it) are published on the host's loopback address only.
# The replay port (the site's nginx passes /replays to it over the network below) is not published on the host at all. Every container of that network can reach the control port (behind the secret)
# and the replay port (read only, no secret): do not put a container there that you do not trust.
services:
  ants-beta:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # optional: which build this is (page footer, --version); without it the image takes the commit from the clone's .git files, else the build time
        ANTS_BUILD_ID: ${ANTS_BUILD_ID:-}
    container_name: ants-beta
    restart: unless-stopped
    ports:
      - "${ANTS_PORT:-19980}:80"
    networks:
      - proxy-network

  ants-server:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        # optional: which build this is (page footer, --version); without it the image takes the commit from the clone's .git files, else the build time
        ANTS_BUILD_ID: ${ANTS_BUILD_ID:-}
    container_name: ants-server
    restart: unless-stopped
    # A stop (a redeploy recreates the container) gives the server this long before docker kills it. The server needs a moment only: on SIGTERM it makes the restart records of its running
    # rooms durable (one fsync a room, a few milliseconds) and exits; the records stay in /results/restart of the volume below, and the server that starts again brings the matches back
    # (docs/NETWORK_PORT.md "Restart records"; only rooms that hold seats keep a record: every room of this server does, unless it is started with --no-reconnect). 15 s is the default 10 s and room for a slow volume: 256 rooms at 30 ms for a flush are 7.7 s. KEEP THE
    # VOLUME ants-server-results: a stack that is removed with its volumes loses the records.
    stop_grace_period: 15s
    # The page web/lobby.html (the front page) joins rooms named "demo-..." that it makes itself: demo rooms are ON here, at most ANTS_DEMO_ROOMS at a time
    # (default 48) on the map ANTS_DEMO_MAP (default TREASURE.LVL) unless the code names one of ANTS_DEMO_MAPS (the page's choice; the maps folder must hold them
    # all). Whoever reaches a game port (the site, or TCP port 4001) can fill these rooms; rooms of the control interface keep their own places.
    # ANTS_DEMO_ROOMS is 1 to 255 (see the header). To switch them off, delete the three demo options. A demo room waits ten minutes for its players; its first player can start it earlier with START (two players at least).
    # --log-mb 4: one room's turn log (what a returning player is given) is at most 4 MiB (a busy 30-minute match logs 0.65 MB), so that the demo rooms alone cannot use up the 256 MiB that
    # all the logs share (docs/NETWORK_PORT.md). Keep ANTS_DEMO_ROOMS times --log-mb under 256 (tests/scripts/test_default_map.py checks it).
    # Replays: a match that ran 30 seconds or more is kept for ANTS_REPLAY_DAYS days (default 30), all of them together at most ANTS_REPLAY_MAX_MB MiB (100), in /results/replays; --replay-demo keeps the
    # matches of the demo rooms too (the front page's games). --replay-port opens the PUBLIC, read-only door of the list and the files (GET /replays, GET /replays/<file>; the site's nginx passes both to it
    # over the network below): ON here, with the port that docker/nginx.conf uses; ANTS_REPLAY_PORT=0 switches it off. The program's own default is off.
    # The files and the list hold the names that the players typed (a player with no name shows as a colour), so those names are public here; no address, room code or chat is in them.
    command: ["--port", "4001", "--ws-port", "4002", "--ctl-port", "4010", "--demo-rooms", "${ANTS_DEMO_ROOMS:-48}", "--demo-map", "${ANTS_DEMO_MAP:-TREASURE.LVL}", "--demo-maps", "${ANTS_DEMO_MAPS:-TINY.LVL,SMALL.LVL,MEDIUM.LVL,GAUNTLET.LVL,TREASURE.LVL,ISLANDS.LVL}", "--log-mb", "4", "--replay-demo", "--replays-days", "${ANTS_REPLAY_DAYS:-30}", "--replays-max-mb", "${ANTS_REPLAY_MAX_MB:-100}", "--replay-port", "${ANTS_REPLAY_PORT:-4020}"]
    environment:
      ANTS_SERVER_SECRET: ${ANTS_SERVER_SECRET:-}
    volumes:
      - ${ANTS_MAPS_DIR:-ants-maps}:/maps:ro
      - ants-server-results:/results
    ports:
      - "${ANTS_SERVER_PORT:-4001}:4001"
      - "127.0.0.1:${ANTS_SERVER_WS_PORT:-4002}:4002"
      - "127.0.0.1:${ANTS_SERVER_CTL_PORT:-4010}:4010"
    networks:
      - proxy-network
    # the program needs nothing but its sockets and the results folder
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64

volumes:
  ants-server-results:
  ants-maps:

networks:
  proxy-network:
    external: true
