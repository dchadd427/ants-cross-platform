<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ants (1998) - Map maker</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preload" href="/front/LibreFranklin-Medium.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/front/classic.css">
<link rel="stylesheet" href="/front/mapmaker.css">
</head>
<body>
<div class="screen ed" id="editor">
<header class="edtop" id="top">
    <a class="edlogo" href="/" aria-label="ants! - the front page"><img src="/front/logo.png" alt="ants!" width="581" height="218"></a>
    <div class="edname">
        <label class="sr" for="map-name">Name of the map</label>
        <input class="nm" id="map-name" type="text" maxlength="40" autocomplete="off" spellcheck="false" disabled>
        <span class="tags" id="top-tags"></span>
    </div>
    <div class="edmenu dsk">
        <button class="btn sm" type="button" data-act="new" disabled>New</button>
        <button class="btn sm" type="button" data-act="open" disabled>Open</button>
        <button class="btn sm" type="button" data-act="download" disabled>Download</button>
    </div>
    <div class="edmenu mob"><button class="btn sm" type="button" data-act="menu" disabled>Menu</button></div>
</header>
<div class="edbody" id="body">
    <aside class="panel tools" aria-label="Tools">
        <h3>Tools</h3>
        <div class="toolbtns" id="toolbtns" role="group" aria-label="Tools">
            <button class="tool" type="button" data-tool="ground" aria-pressed="true" aria-keyshortcuts="G" disabled><i style="background:#5f8f3c"></i>Ground</button>
            <button class="tool" type="button" data-tool="objects" aria-pressed="false" aria-keyshortcuts="O" disabled><i style="background:#2f6b2a"></i>Objects</button>
            <button class="tool" type="button" data-tool="bigger" aria-pressed="false" aria-keyshortcuts="K" aria-label="Bigger objects" title="Bigger objects: grass, leaves, rocks and toys that cover several cells" disabled><i style="background:#8bb83f"></i>Bigger</button>
            <button class="tool" type="button" data-tool="hills" aria-pressed="false" aria-keyshortcuts="H" disabled><i style="background:#c0392b"></i>Hills</button>
            <button class="tool" type="button" data-tool="ants" aria-pressed="false" aria-keyshortcuts="A" disabled><i style="background:#222"></i>Ants</button>
            <button class="tool" type="button" data-tool="food" aria-pressed="false" aria-keyshortcuts="F" disabled><i style="background:#f2c230"></i>Food</button>
            <button class="tool" type="button" data-tool="erase" aria-pressed="false" aria-keyshortcuts="E" disabled><i style="background:#ddd"></i>Erase</button>
            <button class="tool" type="button" data-tool="move" aria-pressed="false" aria-keyshortcuts="M" disabled><i style="background:#8fb3a6"></i>Move</button>
        </div>
        <button class="tilebtn" type="button" id="tile-btn" aria-haspopup="dialog" hidden><i id="tile-chip"></i><span id="tile-name"></span></button>
        <div class="palette" id="palette-box" hidden>
            <h3 id="palette-title">Ground</h3>
            <div class="swatches" id="palette" role="radiogroup" aria-label="Ground to paint with"></div>
            <div class="stepper" id="stepper" hidden><span class="stl" id="stepper-label"></span><span class="stbtns"><button class="stp" type="button" id="step-less" aria-label="Fewer">&minus;</button><output class="stv" id="step-val" aria-live="polite"></output><button class="stp" type="button" id="step-more" aria-label="More">+</button></span></div>
            <div class="pname" id="palette-name"></div>
        </div>
        <p class="toolnote" id="tool-hint"></p>
    </aside>
    <main class="panel canvaswrap">
        <div class="cv" id="cv">
            <canvas class="map" id="map" tabindex="0" role="application" aria-label="The map. Arrow keys move the marked square, Enter paints it with the chosen tool, plus and minus zoom, zero shows the whole map." aria-describedby="where"></canvas>
            <div class="minimap" id="minimap" hidden><canvas id="mini" role="img" aria-label="Small map of the whole map. Click or tap it to look somewhere else."></canvas><div id="mini-cap"></div></div>
            <div class="bootmsg" id="boot" role="status">Loading the map code&hellip;</div>
        </div>
        <div class="cvbar">
            <span class="zoom"><button type="button" data-act="zoom-out" aria-label="Zoom out" disabled>&minus;</button><button type="button" data-act="zoom-in" aria-label="Zoom in" disabled>+</button></span>
            <span id="where"></span><span class="sr" id="announce" role="status"></span>
            <span class="sp"></span>
            <span class="editbar">
            <span class="undoredo" role="group" aria-label="Undo and redo"><button class="eb" type="button" id="undo-btn" aria-keyshortcuts="Control+Z Meta+Z" disabled>Undo</button><button class="eb" type="button" id="redo-btn" aria-keyshortcuts="Control+Shift+Z Meta+Shift+Z" disabled>Redo</button></span>
            <span class="drawopts" role="group" aria-label="Fill and brush size">
                <button class="eb" type="button" id="fill-btn" aria-pressed="false" aria-keyshortcuts="B" disabled>Fill</button>
                <span class="brushes" id="brushes" role="radiogroup" aria-label="Brush size in cells"><span class="bl dsk" aria-hidden="true">Brush</span><button class="eb" type="button" role="radio" data-brush="1" aria-label="Brush of 1 cell" aria-checked="true" disabled>1</button><button class="eb" type="button" role="radio" data-brush="3" aria-label="Brush of 3 cells across" aria-checked="false" tabindex="-1" disabled>3</button><button class="eb" type="button" role="radio" data-brush="5" aria-label="Brush of 5 cells across" aria-checked="false" tabindex="-1" disabled>5</button><button class="eb" type="button" role="radio" data-brush="9" aria-label="Brush of 9 cells across" aria-checked="false" tabindex="-1" disabled>9</button></span>
            </span>
            </span>
        </div>
    </main>
    <aside class="panel side" aria-label="This map">
        <h3>This map</h3>
        <div class="sidetags tags" id="side-tags"></div>
        <dl class="kv"><dt>Rows</dt><dd id="s-rows"></dd><dt>Columns</dt><dd id="s-cols"></dd><dt>Cells</dt><dd id="s-cells"></dd><dt>File</dt><dd id="s-file"></dd></dl>
        <div class="meterbox"><div class="meter" id="meter" role="meter" aria-label="Cells of the most this kind of map can have" aria-valuemin="0"><i id="meter-fill"></i></div><div class="meter-cap" id="meter-cap"></div></div>
        <div class="checkline"><span class="dot" id="check-dot"></span><span id="check-line">Not checked</span></div>
        <div class="chkbtn"><button class="btn full" type="button" data-act="check" disabled>Check map</button></div>
        <div class="phone-row"><span id="size-line"></span><button class="btn sm" type="button" data-act="check" disabled>Check map</button></div>
    </aside>
</div>
<div id="dialogs"></div>
</div>
<input type="file" id="file-in" accept=".lvl,.LVL" hidden>
<noscript><p style="position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b1612;color:#f4ece2;font-size:18px">The map maker needs JavaScript.</p></noscript>
<script src="lvl_core.js"></script>
<script src="lvl_core_api.js"></script>
<script src="front/mapmaker_file.js"></script>
<script src="front/mapmaker_tiles.js"></script>
<script src="front/mapmaker_solid.js"></script>
<script src="front/mapmaker_edit.js"></script>
<script src="front/mapmaker_blocks.js"></script>
<script src="front/mapmaker_objects.js"></script>
<script src="front/mapmaker_palette.js"></script>
<script src="front/mapmaker_view.js"></script>
<script src="front/mapmaker_sizes.js"></script>
<script src="front/mapmaker_checks.js"></script>
<script src="front/mapmaker_dialog.js"></script>
<script src="front/mapmaker_canvas.js"></script>
<script src="front/mapmaker_tools.js"></script>
<script src="front/mapmaker_app.js"></script>
</body>
</html>
