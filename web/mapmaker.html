<header class="sb" data-live="menu" data-version="@@GAME_VERSION@@" data-build="@@BUILD_ID@@" data-built="@@BUILD_DATE@@" data-maker="v1.8.0"><a class="btn sbhome" href="/"><span class="sbchev" aria-hidden="true">&lsaquo;</span>Home</a>
    <nav aria-label="Pages"><a class="btn" href="/">Home</a><a class="btn" href="/matches">Matches</a><a class="btn sblv" href="/live-now"><span>Live now</span><span class="sbn"></span></a><a class="btn" href="/mapmaker" aria-current="page">Map maker</a><a class="btn sbdc" href="https://discord.gg/WaWrXQnKPj" target="_blank" rel="noopener noreferrer" aria-label="Discord server"><svg class="dc" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/></svg></a></nav>

<header class="edtop" id="top">
    <div class="edname">
        <label class="sr" for="map-name">Name of the map</label>
        <input class="nm" id="map-name" type="text" maxlength="40" autocomplete="off" spellcheck="false" disabled>
        <span class="tags" id="top-tags"></span>
    </div>
    <div class="edmenu dsk">
        <button class="btn sm gold" type="button" data-act="play" disabled>&#9654; Play this map</button>
        <button class="btn sm" type="button" data-act="new" disabled>New</button>
        <button class="btn sm" type="button" data-act="open" disabled>Open</button>
        <button class="btn sm" type="button" data-act="mine" disabled>My maps</button>
        <button class="btn sm" type="button" data-act="copy" disabled>Copy...</button>
        <button class="btn sm" type="button" data-act="save" disabled>Save as new...</button>
        <button class="btn sm" type="button" data-act="props" disabled>Properties</button>
        <button class="btn sm" type="button" data-act="download" disabled>Download</button>
        <button class="btn sm" type="button" data-act="submit" disabled>Submit for approval...</button>
    </div>
    <div class="edmenu mob"><button class="btn sm" type="button" data-act="menu" disabled>File</button></div>
</header>
<div class="edbody" id="body">
    <aside class="panel tools" aria-label="Tools">
        <h3>Tools</h3>
        <div class="toolbtns" id="toolbtns" role="group" aria-label="Tools">
            <button class="tool" type="button" data-tool="ground" aria-pressed="true" aria-keyshortcuts="G" disabled><i style="background:#8d7871"></i>Ground</button>
            <button class="tool" type="button" data-tool="objects" aria-pressed="false" aria-keyshortcuts="O" disabled><i style="background:#2f6b2a"></i>Objects</button>
            <button class="tool" type="button" data-tool="bigger" aria-pressed="false" aria-keyshortcuts="K" aria-label="Bigger objects" title="Bigger objects: grass, leaves, rocks and toys that cover several cells" disabled><i style="background:#8bb83f"></i>Bigger</button>
            <button class="tool" type="button" data-tool="hills" aria-pressed="false" aria-keyshortcuts="H" disabled><i style="background:#c0392b"></i>Hills</button>
            <button class="tool" type="button" data-tool="ants" aria-pressed="false" aria-keyshortcuts="A" disabled><i style="background:#222"></i>Ants</button>
            <button class="tool" type="button" data-tool="food" aria-pressed="false" aria-keyshortcuts="F" disabled><i style="background:#f2c230"></i>Food</button>
            <button class="tool" type="button" data-tool="erase" aria-pressed="false" aria-keyshortcuts="E" disabled><i style="background:#ddd"></i>Erase</button>
            <button class="tool" type="button" data-tool="pickup" aria-pressed="false" aria-keyshortcuts="P" title="Pick up: tap an item, then move, copy or delete it" disabled><i style="background:#d9b04a"></i>Pick up</button>
            <button class="tool" type="button" data-tool="pan" aria-pressed="false" aria-keyshortcuts="M" title="Pan: drag to look around" disabled><i style="background:#8fb3a6"></i>Pan</button>
        </div>
        <button class="tilebtn" type="button" id="tile-btn" aria-haspopup="dialog" hidden><i id="tile-chip"></i><span id="tile-name"></span></button>
        <div class="palette" id="palette-box" hidden>
            <h3 id="palette-title">Ground</h3>
            <div class="swatches" id="palette" role="radiogroup" aria-label="Ground to paint with"></div>
            <div class="stepper" id="stepper" hidden><span class="stl" id="stepper-label"></span><span class="stbtns"><button class="stp" type="button" id="step-less" aria-label="Fewer">&minus;</button><output class="stv" id="step-val" aria-live="polite"></output><button class="stp" type="button" id="step-more" aria-label="More">+</button></span></div>
            <div class="pname" id="palette-name"></div>
        </div>
        <p class="toolnote" id="tool-hint"></p>
        <button class="eb tog mob" type="button" id="auto-edges-mob" role="switch" aria-checked="false" disabled hidden><span class="tk" aria-hidden="true"></span><span>Auto edges: Off</span></button>
    </aside>
    <main class="panel canvaswrap">
        <div class="cv" id="cv">
            <canvas class="map" id="map" tabindex="0" role="application" aria-label="The map. Arrow keys move the marked square, Enter paints it with the chosen tool, plus and minus zoom, zero shows the whole map." aria-describedby="where"></canvas>
            <div class="minimap" id="minimap" hidden>
                <div class="mmbar"><button type="button" class="mmgrip" id="mini-grip" aria-label="Move the small map: drag here, or use the arrow keys. Home puts it back in its corner.">&#8942;<span> Map</span></button><button type="button" class="mmbtn" id="mini-lock" aria-pressed="false" aria-label="Lock minimap position">&#128275;</button><button type="button" class="mmbtn" id="mini-hide" aria-label="Hide the small map">Hide</button></div>
                <canvas id="mini" role="img" aria-label="Small map of the whole map. Click or tap it to look somewhere else."></canvas><div id="mini-cap"></div></div>
            <button type="button" class="mmshow" id="mini-show" hidden>Show map</button>
            <div class="atlasnote" id="atlas-note" role="status" hidden></div>
            <div class="bootmsg" id="boot" role="status">Loading the map code&hellip;</div>
        </div>
        <div class="cvbar">
            <span class="zoom"><button type="button" data-act="zoom-out" aria-label="Zoom out" disabled>&minus;</button><button type="button" data-act="zoom-in" aria-label="Zoom in" disabled>+</button></span>
            <span id="where"></span><span class="sr" id="announce" role="status"></span>
            <span class="sp"></span>
            <span class="editbar">
            <span class="undoredo" role="group" aria-label="Undo and redo"><button class="eb" type="button" id="undo-btn" aria-keyshortcuts="Control+Z Meta+Z" disabled>Undo</button><button class="eb" type="button" id="redo-btn" aria-keyshortcuts="Control+Shift+Z Meta+Shift+Z" disabled>Redo</button></span>
            <span class="drawopts" role="group" aria-label="Fill, Fix edges and brush size">
                <button class="eb" type="button" id="fill-btn" aria-pressed="false" aria-keyshortcuts="B" disabled>Fill</button>
                <button class="eb tog dsk" type="button" id="auto-edges-btn" role="switch" aria-checked="false" disabled><span class="tk" aria-hidden="true"></span><span>Auto edges: Off</span></button>
                <button class="eb" type="button" id="edges-btn" disabled>Fix edges...</button>
                <span class="brushes" id="brushes"><label class="bl dsk" for="brush-range">Brush</label><input class="brange" type="range" id="brush-range" data-brush="1" min="1" max="9" step="1" value="1" aria-label="Brush size in cells" disabled><output class="bval" id="brush-val" for="brush-range" aria-live="polite">1</output></span>
            </span>
            </span>
        </div>
    </main>
    <aside class="panel side" aria-label="This map">
        <h3>This map <span class="tags" id="side-rules"></span></h3>
        <div class="sidetags tags" id="side-tags"></div>
        <dl class="kv"><dt>Rows</dt><dd id="s-rows"></dd><dt>Columns</dt><dd id="s-cols"></dd><dt>Cells</dt><dd id="s-cells"></dd><dt>File</dt><dd id="s-file"></dd></dl>
        <div class="meterbox"><div class="meter" id="meter" role="meter" aria-label="Cells of the most this kind of map can have" aria-valuemin="0"><i id="meter-fill"></i></div><div class="meter-cap" id="meter-cap"></div></div>
        <div class="convertbox"><button class="link" type="button" id="resize-link" data-act="resize" disabled>Resize map...</button><button class="link" type="button" id="convert-link" data-act="convert" disabled></button></div>
        <div class="sumbox" id="sumbox"><div class="hd"><h3>Details</h3><button class="link" type="button" data-act="props" disabled>Edit</button></div><div class="desc" id="s-desc"></div><div id="s-time"></div><div id="s-ant"></div></div>
        <div class="checkline"><span class="dot" id="check-dot"></span><span id="check-line">Not checked</span></div>
        <div class="chkbtn"><button class="btn full" type="button" data-act="check" disabled>Check map</button></div>
        <div class="phone-row"><span id="size-line"></span><button class="btn sm" type="button" data-act="check" disabled>Check map</button></div>
        <div class="phsum"><span class="t" id="phone-sum"></span><button class="link" type="button" data-act="props" disabled>Edit</button></div>
    </aside>
</div>
<div id="dialogs"></div>
<section class="mine" id="mine" hidden aria-labelledby="mine-title">
    <header class="mhead"><h1 class="banner gold" id="mine-title" tabindex="-1">My maps</h1></header>
    <div class="mwrap">
        <div class="mtabs" id="mine-tabs" role="group" aria-label="My maps or My submissions" hidden></div>
        <div class="mtools"><button class="btn big" type="button" id="mine-new">New map</button><span class="mchips" id="mine-chips" role="group" aria-label="Which maps to show" hidden></span><button class="btn sm ghost" type="button" id="mine-link" hidden>Copy my status link</button><button class="btn sm ghost" type="button" id="mine-back">Back to the map</button></div>
        <p class="sr" id="mine-status" role="status"></p><p class="mnote" id="mine-note"></p>
        <div class="mlist" id="mine-list"></div>
    </div>
</section>
</div>
<div class="screen crop" id="crop" hidden>
<header class="crtop"><h1 class="banner gold" id="crop-title">Crop to fit</h1></header>
<div class="crbody">
    <section class="panel crmap" id="crop-map" aria-labelledby="crop-title">
        <div class="crwho"><span class="crname" id="crop-name"></span><span class="tags" id="crop-tags"></span></div>
        <p class="crhelp">Drag the frame to choose the part you keep. Drag a corner or an edge to make it smaller or wider.</p>
        <div class="crstage" id="crop-stage"><div class="crframe" id="crop-frame" tabindex="0" role="group" aria-label="The part you keep. The arrow keys move it."><span class="crdrag" aria-hidden="true">&#10021; Drag</span><i class="h nw" data-h="nw"></i><i class="h n" data-h="n"></i><i class="h ne" data-h="ne"></i><i class="h w" data-h="w"></i><i class="h e" data-h="e"></i><i class="h sw" data-h="sw"></i><i class="h s" data-h="s"></i><i class="h se" data-h="se"></i></div></div>
        <p class="crwhole" id="crop-whole"></p>
        <div class="crshapes"><p id="crop-shapes"></p><div class="chips" id="crop-chips"></div></div>
    </section>
    <aside class="crside">
        <div class="panel crread"><div class="crlab">The part you keep</div><div class="crbig" id="crop-big" aria-live="polite"></div><div class="meter"><i id="crop-fill"></i></div><div class="crcells" id="crop-cells"></div><div class="crrange" id="crop-range"></div></div>
        <div id="crop-note" aria-live="polite"></div>
        <div class="crbtns"><button class="btn big" type="button" id="crop-use">Use this part</button><button class="btn ghost" type="button" id="crop-cancel">Cancel</button></div>
        <p class="crnothing" id="crop-nothing"></p>
    </aside>
</div>
</div>
<input type="file" id="file-in" accept=".lvl,.LVL" hidden>
<noscript><p style="position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b1612;color:#f4ece2;font-size:18px">The map maker needs JavaScript.</p></noscript>

<script src="lvl_core_api.js"></script>
<script src="front/mapmaker_file.js"></script>
<script src="front/mapmaker_tiles.js"></script>
<script src="front/mapmaker_solid.js"></script>
<script src="front/mapmaker_edit.js"></script>
<script src="front/mapmaker_blocks.js"></script>
<script src="front/mapmaker_objects.js"></script>
<script src="front/mapmaker_palette.js"></script>
<script src="front/mapmaker_view.js"></script>
<script src="front/mapmaker_sizes.js"></script>
<script src="front/mapmaker_checks.js"></script>
<script src="front/mapmaker_dialog.js"></script>
<script src="front/mapmaker_props.js"></script>
<script src="front/mapmaker_store.js"></script>
<script src="front/mapmaker_mine.js"></script>
<script src="front/mapmaker_minimap.js"></script>
<script src="front/mapmaker_canvas.js"></script>
<script src="front/mapmaker_tools.js"></script>
<script src="front/mapmaker_app.js"></script>
<script src="site_nav.js"></script>
</body>
