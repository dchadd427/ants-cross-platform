# Weekly cleanup of the branches that nobody works on (tools/stale_branches.py, docs/WORKFLOW.md "Branches, pull requests and releases"). GitHub already deletes the branch of a
# merged pull request; this deletes the ones that were never merged: no open pull request and no commit for 30 days. It never touches the default branch, `staging`, a protected
# branch or a branch with an open pull request of this repository, and deletes at most 25 a run. A manual run is a dry run (it only says what it would delete) unless asked.
name: Stale branches

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only say what would be deleted'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: stale-branches
  cancel-in-progress: false

jobs:
  clean:
    name: Delete stale branches
    if: github.repository == 'dchadd427/ants-cross-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools/stale_branches.py
      - name: Delete the branches idle for 30 days
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          flag=""
          if [ "$DRY_RUN" = "true" ]; then flag="--dry-run"; fi
          python3 tools/stale_branches.py --days 30 $flag
