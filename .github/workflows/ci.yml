# Throwaway probe, never merged: stands in for CI on one pull request to see whether GitHub treats a required check that a job-level `if` skipped as passing.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
  macos:
    name: macOS (Apple clang)
    if: ${{ github.event_name == 'pull_request' && 1 == 2 }}
    runs-on: ubuntu-latest
    steps:
      - run: echo never
  windows:
    name: Windows (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC 2022
          - name: MSVC 2026
    steps:
      - run: echo ok
  web:
    name: Web (Emscripten, Docker image)
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
