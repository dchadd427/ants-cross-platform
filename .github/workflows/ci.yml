# Continuous integration: every pull request, every push to main, and every manual run is built and tested on Windows (MSVC), macOS (Apple clang) and Linux (GCC),
# and the web image (Emscripten, the beta site's Docker build) and the game server's image are built once. main is protected: it takes a change only through a pull request whose five
# checks pass, and these five checks are the jobs "Linux (GCC)", "macOS (Apple clang)", "Windows (MSVC 2022)", "Windows (MSVC 2026)" and "Web (Emscripten, Docker image)": rename or split
# none of them without changing the branch protection in the same release (tests/scripts/test_ci_workflow.py keeps the names). What runs where is listed in docs/TESTING.md ("Continuous
# Integration"); the tiers of tests and the release procedure: docs/WORKFLOW.md.
#
# The Linux and macOS work is shared between jobs that run side by side (the tests, not the build, take the time), behind the same two names:
#   - `linux_tests` and `macos_tests` build and test. Each is a matrix of legs: ctest in parts (Linux), the tool self-tests and the script suites, the python tests (in slices on Linux, the
#     groups that depend on the system on macOS: tests/scripts/run_python_tests.py). Every leg builds what it needs from the compiler cache (about a minute).
#   - `linux` and `macos` are small jobs that carry the required names. They look at the result of the legs and pass only when every leg passed. `linux` runs whatever the legs did
#     (`if: always()`), because a job whose needs failed would otherwise be skipped, and a skipped job counts as passing for a required check: the explicit test is what keeps a failed leg from passing.
#   - `changes`, the first job, decides for a pull request (never for a push or a manual run) whether the change is of documents, web pages and page tests only, apart from the few files that the C++ tests
#     and the macOS script suite read (tools/ci_light.sh; the rules are in docs/WORKFLOW.md). Then `macos` and its legs are skipped, and the Windows jobs run but skip their steps: a matrix job that a
#     job-level `if` skips is reported once, under the unexpanded template of its name, so the required names "Windows (MSVC 2022)" and "Windows (MSVC 2026)" would never appear. Linux and the web job
#     run in full for every change. If `changes` itself fails, everything runs.
#
# The suites are the ones run_tests.sh runs (a test compares the two lists): ctest runs every test program that the CMake project registers (assets, simulation, network, server, bots,
# application), then the self-tests of the four tools (map_sweep, bot_arena, replay_tool, lvl_tool; bot_watch and gen_food_footprints are only built, so that no change breaks them unseen; on Linux and macOS also a sweep of Community-Maps, checked by tools/community_maps.py), the opaque-box E2E runner and, where bash and python3 exist (macOS, Linux), the two script suites
# (start_game.sh --dry-run; ants_server with headless clients, its six parts, five at a time) and the repository checks (the version and changelog consistency check and the python
# tests of tests/scripts). The web job also builds the game server's image. There is no sanitizer job (AddressSanitizer and UBSan: ./run_tests.sh
# --asan, locally) and the browser-based checks are opt-in (docs/TESTING.md).
#
# CI does not deploy: the site follows main through the host's own automatic update (docs/WORKFLOW.md, "Deploy").
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One run per branch (or pull request): a newer push cancels the run of the older one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The tests choose SDL's dummy drivers themselves; this is for the game binary that the script suites start (no window, no sound card on a runner).
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
  CTEST_OUTPUT_ON_FAILURE: "1"
  # How the Linux legs share ctest (names of tests, as regular expressions; the times are those of a run of the whole of ctest, in seconds): test_engine_lookups takes 530 and decides the time of a
  # leg that has it, so it runs alone; the next legs take the four tests that take 160 to 290 seconds, and every other test (test_server, test_network_app and the 95 that are short: a new test lands
  # here, and a name that matches nothing is an error because of --no-tests=error).
  CTEST_ALONE: "^test_engine_lookups$"
  CTEST_LONG: "^(test_ai|test_lockstep|test_ai_worker|test_engine_copy)$"

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Which checks does this change need?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      light: ${{ steps.decide.outputs.light }}
    steps:
      # The whole history, for the merge base of a pull request and its base. Nothing is pushed from here: the checkout keeps no credentials.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The decision and every changed file are printed. The commit ids come through the environment; no text of the pull request (title, branch, body) is read by this job. The change is judged
      # against the base of the pull request and against main (MAIN_REF, a literal): a pull request that is retargeted starts no new run, so the verdict must not depend on the base.
      - name: Light checks or all of them?
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAIN_REF: refs/remotes/origin/main
        run: bash tools/ci_light.sh

  linux_tests:
    name: Linux tests (${{ matrix.name }})
    # pinned: the compiler under the required check changes only with this file (the default image has GCC 15 now, which the code also builds with)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # The legs are chosen so that none takes much longer than the longest test or group (docs/TESTING.md has the times): ctest in three parts, the tool self-tests with the E2E runner and the
        # script suites, and the python tests in three slices (`run_python_tests.py --shard`; the three groups of the page tests that take minutes each are in different slices). Every leg builds
        # everything: with the compiler cache that is about a minute, and the python tests use some built programs (bot_arena, ants_server), which they skip when they are not there.
        include:
          - id: ctest-lookups
            name: "ctest: test_engine_lookups alone"
            part: ctest-lookups
          - id: ctest-long
            name: "ctest: the next longest tests"
            part: ctest-long
          - id: ctest-rest
            name: "ctest: all the other tests"
            part: ctest-rest
          - id: scripts
            name: "tool self-tests, E2E runner, script suites"
            part: scripts
          - id: python-1
            name: "python tests, slice 1 of 3"
            part: python
            slice: 1/3
          - id: python-2
            name: "python tests, slice 2 of 3"
            part: python
            slice: 2/3
          - id: python-3
            name: "python tests, slice 3 of 3"
            part: python
            slice: 3/3
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 400M
    steps:
      - uses: actions/checkout@v7

      # python3-yaml: tests/scripts/test_ci_workflow.py reads this file with PyYAML (its checks of the legs are skipped without it, and a test fails on these machines when it is missing)
      - name: Install SDL2, SDL2_ttf, ccache, Ninja, PyYAML
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev libsdl2-ttf-dev ccache ninja-build python3-yaml

      - name: Restore the compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Configure (Release, warnings are errors)
        run: |
          gcc --version | head -1
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DANTS_WERROR=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build the game, the server and the test programs
        id: build
        run: |
          cmake --build build -- -k 0
          cmake --build build --target map_sweep bot_arena replay_tool lvl_tool bot_watch gen_food_footprints -- -k 0
          ccache -s

      - name: Build the E2E runner
        id: build_e2e
        if: ${{ matrix.part == 'scripts' }}
        run: |
          cmake -S tests/e2e -B build_e2e -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build_e2e

      - name: Test programs (ctest, test_engine_lookups alone)
        if: ${{ !cancelled() && steps.build.conclusion == 'success' && matrix.part == 'ctest-lookups' }}
        run: ctest --test-dir build --output-on-failure --timeout 900 --parallel 4 --no-tests=error -R "$CTEST_ALONE"

      - name: Test programs (ctest, the next longest tests)
        if: ${{ !cancelled() && steps.build.conclusion == 'success' && matrix.part == 'ctest-long' }}
        run: ctest --test-dir build --output-on-failure --timeout 900 --parallel 4 --no-tests=error -R "$CTEST_LONG"

      - name: Test programs (ctest, all the other tests)
        if: ${{ !cancelled() && steps.build.conclusion == 'success' && matrix.part == 'ctest-rest' }}
        run: ctest --test-dir build --output-on-failure --timeout 900 --parallel 4 --no-tests=error -E "${CTEST_ALONE}|${CTEST_LONG}"

      - name: Tool self-tests (map_sweep, bot_arena, replay_tool, lvl_tool) and the community maps
        if: ${{ !cancelled() && steps.build.conclusion == 'success' && matrix.part == 'scripts' }}
        run: |
          status=0
          build/map_sweep --selftest || status=1
          build/map_sweep Community-Maps --ticks 600 --jobs 2 --out build/community_sweep.json > build/community_sweep.log 2>&1 || { grep -q '^Findings$' build/community_sweep.log && sed -n '/^Findings$/,$p' build/community_sweep.log || tail -40 build/community_sweep.log; status=1; }
          python3 tools/community_maps.py verify Community-Maps build/community_sweep.json || status=1
          build/bot_arena --selftest || status=1
          build/replay_tool --selftest || status=1
          build/lvl_tool --selftest || status=1
          exit $status

      - name: Opaque-box E2E runner
        if: ${{ !cancelled() && steps.build_e2e.conclusion == 'success' && matrix.part == 'scripts' }}
        run: build_e2e/e2e_runner --all

      - name: Script suites (start script, dedicated server with two headless clients)
        if: ${{ !cancelled() && steps.build.conclusion == 'success' && matrix.part == 'scripts' }}
        run: |
          status=0
          bash tests/scripts/test_start_game.sh || status=1
          # the server end-to-end script is six parts (its own --list-parts names them) that need no port or folder in common: they run side by side, five at a time
          export BUILD_DIR=build
          bash tests/scripts/test_ants_server.sh --list-parts | xargs -P 5 -I{} bash tests/scripts/test_ants_server.sh --part {} || status=1
          exit $status

      # Every slice runs the version check (a second), so that each leg of the python tests ends with the same repository checks as before.
      - name: Repository checks (version and changelog consistency, python tests of the tools and the tiers)
        if: ${{ !cancelled() && matrix.part == 'python' }}
        env:
          SLICE: ${{ matrix.slice }}
        run: |
          status=0
          python3 tools/check_version_consistency.py || status=1
          python3 tests/scripts/run_python_tests.py --shard "$SLICE" || status=1
          exit $status

      - name: Keep the test logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-test-logs-${{ matrix.id }}
          path: build/Testing/Temporary/
          if-no-files-found: ignore

  # The required check "Linux (GCC)": it passes when every leg of linux_tests passed. It runs whatever the legs did (a job whose needs failed would be skipped, and a skipped job counts as passing).
  linux:
    name: Linux (GCC)
    needs: linux_tests
    if: ${{ always() }}
    # pinned like linux_tests (its legs), for the same reason
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Did every Linux job pass?
        env:
          RESULT: ${{ needs.linux_tests.result }}
        run: |
          echo "the Linux test jobs: $RESULT"
          [ "$RESULT" = success ] || { echo "a Linux test job failed, was cancelled or did not run: this check fails"; exit 1; }

  macos_tests:
    name: macOS tests (${{ matrix.name }})
    needs: changes
    # Skipped for a change of web pages, documents and page tests only (the job `changes`); if that job failed, everything runs.
    if: ${{ !cancelled() && needs.changes.outputs.light != 'true' }}
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Two legs: ctest, which takes as long as its longest test (about 410 seconds), and the rest. Of the python tests the leg runs the groups that depend on the system (servers, sockets, HTTP,
        # clocks, shells, file names and paths, compilers; run_python_tests.py --skip-linux-only): Linux runs every python test.
        include:
          - id: ctest
            name: ctest
            part: ctest
          - id: scripts-python
            name: tool self-tests, script suites, python tests
            part: scripts-python
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 400M
    steps:
      - uses: actions/checkout@v7

      # Not `brew install sdl2`: Homebrew's sdl2 is now sdl2-compat (the SDL2 interface on top of SDL3), under which eight test programs failed in the first run of this job
      # (pointer, window and canvas checks, pixel fingerprints, one crash). The game is written for SDL2, so SDL2 and SDL2_ttf (with HarfBuzz, as Homebrew's and the distributions'
      # SDL2_ttf have: the text widths that some tests pin to the pixel depend on it) are built from the release sources, the versions of a developer's Mac, and cached.
      - name: Install ccache and Ninja
        run: brew install ccache ninja

      - name: Restore SDL2 and SDL2_ttf
        id: sdl
        uses: actions/cache@v6
        with:
          path: ~/sdl2
          key: sdl2-${{ runner.os }}-${{ runner.arch }}-2.32.10-ttf-2.24.0-harfbuzz-v2

      - name: Build SDL2 2.32.10 and SDL2_ttf 2.24.0 from source
        if: steps.sdl.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/sdl-src" && cd "$RUNNER_TEMP/sdl-src"
          curl -fsSL -o SDL2.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.tar.gz
          curl -fsSL -o SDL2_ttf.tar.gz https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.24.0/SDL2_ttf-2.24.0.tar.gz
          printf '%s  %s\n' \
            '5f5993c530f084535c65a6879e9b26ad441169b3e25d789d83287040a9ca5165' 'SDL2.tar.gz' \
            '0b2bf1e7b6568adbdbc9bb924643f79d9dedafe061fa1ed687d1d9ac4e453bfd' 'SDL2_ttf.tar.gz' | shasum -a 256 -c -
          tar xzf SDL2.tar.gz && tar xzf SDL2_ttf.tar.gz
          cmake -S SDL2-2.32.10 -B sdl2-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/sdl2" -DSDL_TEST=OFF
          cmake --build sdl2-build
          cmake --install sdl2-build
          cmake -S SDL2_ttf-2.24.0 -B ttf-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/sdl2" -DCMAKE_PREFIX_PATH="$HOME/sdl2" -DSDL2TTF_VENDORED=ON -DSDL2TTF_HARFBUZZ=ON -DSDL2TTF_SAMPLES=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build ttf-build
          cmake --install ttf-build

      - name: Restore the compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Configure (Release, warnings are errors)
        run: |
          clang --version | head -1
          cmake --version | head -1
          "$HOME/sdl2/bin/sdl2-config" --version
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DANTS_WERROR=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_PREFIX_PATH="$HOME/sdl2"

      - name: Build the game, the server and the test programs
        id: build
        run: |
          cmake --build build -- -k 0
          cmake --build build --target map_sweep bot_arena replay_tool lvl_tool bot_watch gen_food_footprints -- -k 0
          ccache -s

      - name: Build the E2E runner
        id: build_e2e
        if: ${{ matrix.part == 'scripts-python' }}
        run: |
          cmake -S tests/e2e -B build_e2e -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build_e2e

      - name: Test programs (ctest)
        if: ${{ !cancelled() && steps.build.conclusion == 'success' && matrix.part == 'ctest' }}
        run: ctest --test-dir build --output-on-failure --timeout 900 --parallel 4 --no-tests=error

      - name: Tool self-tests (map_sweep, bot_arena, replay_tool, lvl_tool) and the community maps
        if: ${{ !cancelled() && steps.build.conclusion == 'success' && matrix.part == 'scripts-python' }}
        run: |
          status=0
          build/map_sweep --selftest || status=1
          build/map_sweep Community-Maps --ticks 600 --jobs 2 --out build/community_sweep.json > build/community_sweep.log 2>&1 || { grep -q '^Findings$' build/community_sweep.log && sed -n '/^Findings$/,$p' build/community_sweep.log || tail -40 build/community_sweep.log; status=1; }
          python3 tools/community_maps.py verify Community-Maps build/community_sweep.json || status=1
          build/bot_arena --selftest || status=1
          build/replay_tool --selftest || status=1
          build/lvl_tool --selftest || status=1
          exit $status

      - name: Opaque-box E2E runner
        if: ${{ !cancelled() && steps.build_e2e.conclusion == 'success' && matrix.part == 'scripts-python' }}
        run: build_e2e/e2e_runner --all

      - name: Script suites (start script, dedicated server with two headless clients)
        if: ${{ !cancelled() && steps.build.conclusion == 'success' && matrix.part == 'scripts-python' }}
        run: |
          status=0
          bash tests/scripts/test_start_game.sh || status=1
          # the server end-to-end script is six parts (its own --list-parts names them) that need no port or folder in common: they run side by side, five at a time
          export BUILD_DIR=build
          bash tests/scripts/test_ants_server.sh --list-parts | xargs -P 5 -I{} bash tests/scripts/test_ants_server.sh --part {} || status=1
          exit $status

      - name: Repository checks (version and changelog consistency, python tests of the tools and the tiers that depend on the system)
        if: ${{ !cancelled() && matrix.part == 'scripts-python' }}
        run: |
          status=0
          python3 tools/check_version_consistency.py || status=1
          python3 tests/scripts/run_python_tests.py --skip-linux-only || status=1
          exit $status

      - name: Keep the test logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-test-logs-${{ matrix.id }}
          path: build/Testing/Temporary/
          if-no-files-found: ignore

  # The required check "macOS (Apple clang)": it passes when every leg of macos_tests passed, and is skipped (which counts as passing) together with them when the change is of pages, documents
  # and page tests only. Like "Linux (GCC)" it runs whatever the legs did.
  macos:
    name: macOS (Apple clang)
    needs: [changes, macos_tests]
    if: ${{ always() && needs.changes.outputs.light != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Did every macOS job pass?
        env:
          RESULT: ${{ needs.macos_tests.result }}
        run: |
          echo "the macOS test jobs: $RESULT"
          [ "$RESULT" = success ] || { echo "a macOS test job failed, was cancelled or did not run: this check fails"; exit 1; }

  windows:
    name: Windows (${{ matrix.name }})
    needs: changes
    # For a change of web pages, documents and page tests only (the job `changes`) there is nothing to build: the job then runs on a small Linux machine and every step below is skipped. (It is not
    # skipped as a whole: a matrix job that is skipped by its `if` is reported once, under the unexpanded template of its name, so that "Windows (MSVC 2022)" and "Windows (MSVC 2026)", the names
    # that main requires, would never be reported and the pull request could not be merged.) If `changes` failed, everything runs: the `if` below (no `success()`) keeps the job from being skipped
    # with it, which a plain `needs` would do.
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.changes.outputs.light == 'true' && 'ubuntu-latest' || matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Visual Studio 2022 (MSVC 19.4x) is what developers build with (windows-2022); windows-latest (and windows-2025) have Visual Studio 2026, the newest compiler.
        # MSVC 2026 runs for every pull request and push; MSVC 2022 for pull requests, pushes to main and manual runs (not for a push to any other branch), which is what the matrix
        # below says: the list is chosen here, because a job's own `if` cannot see its matrix.
        include: ${{ fromJSON(github.event_name == 'push' && github.ref != 'refs/heads/main' && '[{"name":"MSVC 2026","os":"windows-latest"}]' || '[{"name":"MSVC 2022","os":"windows-2022"},{"name":"MSVC 2026","os":"windows-latest"}]') }}
    env:
      # The compiler cache: sccache (with the Ninja generator under the MSVC environment, as the Visual Studio generators cannot use a launcher), its folder cached like the
      # ccache folder of the Linux job (keyed by the runner image and the commit, restored from the latest older one).
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 600M
    steps:
      - name: Nothing to build (only web pages, documents and page tests changed)
        if: ${{ needs.changes.outputs.light == 'true' }}
        run: |
          echo "Light checks: no file of this change is read by the Windows build or its tests (see the first job, Which checks does this change need?)."

      - uses: actions/checkout@v7
        if: ${{ needs.changes.outputs.light != 'true' }}

      - name: Restore the compiler cache
        if: ${{ needs.changes.outputs.light != 'true' }}
        uses: actions/cache@v6
        with:
          path: .sccache
          key: sccache-${{ matrix.os }}-${{ github.sha }}
          restore-keys: sccache-${{ matrix.os }}-

      # sccache: a pinned release of Mozilla's compiler cache, its SHA-256 checked (the digest is the one that GitHub shows for the release asset).
      - name: Install sccache 0.14.0
        if: ${{ needs.changes.outputs.light != 'true' }}
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $version = '0.14.0'
          $sha256 = '74a3ffd4207e8e0e62af7747bd03b42deab0f6dabc7ef0a8cdd950f83f1037c8'
          $zip = Join-Path $env:RUNNER_TEMP "sccache-v$version.zip"
          Invoke-WebRequest -Uri "https://github.com/mozilla/sccache/releases/download/v$version/sccache-v$version-x86_64-pc-windows-msvc.zip" -OutFile $zip
          if ((Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLower() -ne $sha256) { throw 'sccache: the checksum of the download is not the pinned one' }
          $folder = Join-Path $env:RUNNER_TEMP 'sccache'
          Expand-Archive -Path $zip -DestinationPath $folder
          $exe = Get-ChildItem -Path $folder -Recurse -Filter sccache.exe | Select-Object -First 1
          Add-Content -Path $env:GITHUB_PATH -Value $exe.DirectoryName
          & $exe.FullName --version

      # The Visual C++ environment (cl, link, the include and library paths) for the steps below; the action is pinned to the commit of its tag v1.13.0.
      - name: Set up the MSVC environment (x64)
        if: ${{ needs.changes.outputs.light != 'true' }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64

      # SDL2 and SDL2_ttf are not installed: CMakeLists.txt downloads the prebuilt Visual C++ packages itself (FetchContent), as it does on a developer's PC.
      - name: Configure (Ninja, Release, warnings are errors, sccache)
        if: ${{ needs.changes.outputs.light != 'true' }}
        run: |
          cmake --version | head -1
          cl 2>&1 | head -1 || true
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DANTS_WERROR=ON -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build the game, the server and the test programs (Release)
        id: build
        if: ${{ needs.changes.outputs.light != 'true' }}
        run: |
          cmake --build build
          cmake --build build --target map_sweep bot_arena replay_tool lvl_tool bot_watch gen_food_footprints

      - name: Build the E2E runner (Release)
        id: build_e2e
        if: ${{ needs.changes.outputs.light != 'true' }}
        run: |
          cmake -S tests/e2e -B build_e2e -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build build_e2e

      - name: Compiler cache statistics
        if: ${{ !cancelled() && needs.changes.outputs.light != 'true' }}
        run: |
          sccache --show-stats || true
          sccache --stop-server || true

      - name: Test programs (ctest)
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        run: ctest --test-dir build --output-on-failure --timeout 900 --parallel 4 --no-tests=error

      - name: Tool self-tests (map_sweep, bot_arena, replay_tool, lvl_tool)
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        run: |
          status=0
          build/map_sweep.exe --selftest || status=1
          build/bot_arena.exe --selftest || status=1
          build/replay_tool.exe --selftest || status=1
          build/lvl_tool.exe --selftest || status=1
          exit $status

      - name: Opaque-box E2E runner
        if: ${{ !cancelled() && steps.build_e2e.conclusion == 'success' }}
        run: build_e2e/e2e_runner.exe --all

      - name: Keep the test logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.os }}-test-logs
          path: build/Testing/Temporary/
          if-no-files-found: ignore

  web:
    name: Web (Emscripten, Docker image)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # The same build as the beta site's image (Dockerfile: emsdk, the WebAssembly game, the page, nginx). Nothing is pushed or run anywhere.
      - name: Build the web image
        run: docker build -t ants-beta .

      - name: Check the image (nginx accepts its configuration, the game's files are in it, the page names the version and the build)
        run: |
          docker run --rm ants-beta nginx -t
          docker run --rm ants-beta sh -c 'cd /usr/share/nginx/html && ls -l index.html play.html lobby.html matches.html match.html live.html matches.css history_page.js replay_stats.css replay_page.js map_files.js index.js index.wasm index.data match_stats.js match_stats.css countdown_button.js changelog.html site_nav.css site_nav.js death_map.js death_map.css front/logo.png front/LibreFranklin-Medium.ttf front/ants.png front/lobby_rules.js front/lobby_net.js front/lobby_chat.js front/lobby_chat.css front/map_picker.css front/classic.css front/rematch.js front/rematch.css front/game_modes.js front/game_type.js front/game_type.css mapmaker.html front/mapmaker.css front/mapmaker_file.js front/mapmaker_tiles.js front/mapmaker_solid.js front/mapmaker_palette.js front/mapmaker_edit.js front/mapmaker_blocks.js front/mapmaker_objects.js front/mapmaker_view.js front/mapmaker_sizes.js front/mapmaker_checks.js front/mapmaker_dialog.js front/mapmaker_props.js front/mapmaker_crop.js front/mapmaker_convert.js front/mapmaker_minimap.js front/mapmaker_canvas.js front/mapmaker_tools.js front/mapmaker_app.js front/mapmaker_ground.js front/mapmaker_sprites.js front/mapmaker_edges.js front/mapmaker_ants.js front/mapmaker_ants.css front/mapmaker_pickup.js front/mapmaker_pickup.css front/mapmaker_play.js front/mapmaker_play.css front/mapmaker_store.js front/mapmaker_mine.js front/mapmaker_submit.js front/test_game.js home/home.js home/home.css home/chat.js home/chat.css home/games.js home/games.css home/players.js home/players.css home/talk.js home/talk.css mapmaker_atlas/atlas.json mapmaker_atlas/ground.png mapmaker_atlas/objects.png asset_catalog/sprites/sprite_0726.png lvl_core.js lvl_core.wasm lvl_core_api.js shapes.js shape_picker.js admin.html admin.css admin_page.js game_menu.js game_menu.css && cmp index.html play.html'
          docker run --rm ants-beta sh -c 'cd /usr/share/nginx/html && for page in index.html play.html lobby.html matches.html match.html live.html; do grep -Eo "id=.?game-version.?>[^<]*<" $page && grep -Eo "id=.?game-build-id.?>[^<]*<" $page && grep -Eo "id=.?game-build-date.?>[^<]*<" $page && ! grep -q "@@" $page || exit 1; done'

      # The map core's module (docs/MAP_FORMAT.md, "In the browser"), taken out of the image that was just built and run in node on the library's maps: its answers are the native core's, byte
      # for byte (tests/scripts/lvl_core_check.js; --require makes a missing module a failure). The sizes are in the log.
      - name: Run the map core's browser module in node
        run: |
          mkdir -p lvl_core_from_image
          docker create --name ants-lvl-core ants-beta
          for f in lvl_core.js lvl_core.wasm; do docker cp "ants-lvl-core:/usr/share/nginx/html/$f" lvl_core_from_image/; done
          docker rm ants-lvl-core
          ls -l lvl_core_from_image web/lvl_core_api.js
          node --version
          node tests/scripts/lvl_core_check.js --module lvl_core_from_image --require
          node tests/scripts/web_mapmaker_core_check.js --module lvl_core_from_image --require
          node tests/scripts/web_mapmaker_play_check.js --module lvl_core_from_image --require
          node tests/scripts/web_mapmaker_pickup_check.js --module lvl_core_from_image --require

      # The routes of the site: "/" is the front page (the lobby) unless the address is a game's (?join=), /four.html redirects to "/" for good, /play is the game page, every page is asked for without .html (the old address is a 301 that keeps the query; /live-now is the matches page because /live is the server's list), and every html answer has
      # the revalidation headers (tests/scripts/web_routes_check.py). The game server is not needed: nginx starts without it.
      - name: Check the routes of the site (the front page, the game page's addresses, the redirect of the old Play online address, the six original maps)
        run: |
          docker run -d --name ants-routes -p 127.0.0.1:18080:80 ants-beta
          for i in $(seq 1 50); do curl -fs -o /dev/null http://127.0.0.1:18080/ && break; sleep 0.2; done
          python3 tests/scripts/web_routes_check.py --web http://127.0.0.1:18080/ || { docker logs ants-routes; docker rm -f ants-routes; exit 1; }
          # the six original maps are served like every map file (the Map Maker opens one as a starting point): byte for byte the files of Original-Ants/Maps
          for n in TINY SMALL MEDIUM GAUNTLET TREASURE ISLANDS; do
            curl -fsS "http://127.0.0.1:18080/maps/files/$n.LVL" | cmp - "Original-Ants/Maps/$n.LVL" || { docker logs ants-routes; docker rm -f ants-routes; exit 1; }
          done
          docker rm -f ants-routes

      # The game server's image (Dockerfile.server): built the same way as the stack's, and it must say which build it is.
      - name: Build the game server image and run its --version
        run: |
          docker build -f Dockerfile.server -t ants-server .
          docker run --rm --entrypoint /usr/local/bin/ants_server ants-server --version

      # The chat hub's image (Dockerfile.hub, docs/HUB.md): built the way the stacks build it, and started the way they start it (read only, no capabilities, no new privileges, 32 processes, 192 MB, a
      # tmpfs for /tmp, a volume for the database): its health check must say healthy, its command line tool must open the database, and a socket from the wrong site must be refused. (No sixth
      # required check: this is a step of the Web job.)
      - name: Build the chat hub image and start it with the stack's hardening
        run: |
          docker build -f Dockerfile.hub -t ants-hub .
          docker run -d --name ants-hub-check --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 32 --memory 192m --tmpfs /tmp --health-interval 2s --health-start-period 2s -v ants-hub-check-data:/data \
            -e ANTS_HUB_PUBLIC_URL=https://chat.example.org ants-hub
          ok=
          for i in $(seq 1 40); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' ants-hub-check)" = healthy ] && ok=1 && break
            sleep 2
          done
          docker logs ants-hub-check
          [ -n "$ok" ] || { docker rm -f ants-hub-check; exit 1; }
          docker exec ants-hub-check python -m hub.admin list
          docker exec ants-hub-check python -c "import http.client as h; c = h.HTTPConnection('127.0.0.1', 4040); c.request('GET', '/hub/ws', headers={'Origin': 'https://evil.example', 'Upgrade': 'websocket', 'Connection': 'Upgrade', 'Sec-WebSocket-Key': 'dGhlIHNhbXBsZSBub25jZQ==', 'Sec-WebSocket-Version': '13'}); r = c.getresponse(); print(r.status, r.read()); raise SystemExit(0 if r.status == 403 else 1)" || { docker rm -f ants-hub-check; exit 1; }
          docker rm -f ants-hub-check
          docker volume rm ants-hub-check-data

      # The stack file (docker-compose.stack.yml) must render.
      - name: Check the stack file
        run: |
          docker compose -f docker-compose.stack.yml config --quiet
