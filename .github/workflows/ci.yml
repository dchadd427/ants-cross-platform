# Throwaway probe, never merged: stands in for CI on one pull request to see what GitHub does with the five required checks of main.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest
    steps:
      - run: echo ok

  macos:
    name: macOS (Apple clang)
    runs-on: ubuntu-latest
    steps:
      - run: echo ok

  windows:
    name: Windows (${{ matrix.name }})
    if: ${{ 1 == 2 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC 2022
          - name: MSVC 2026
    steps:
      - run: echo ok

  web:
    name: Web (Emscripten, Docker image)
    runs-on: ubuntu-latest
    steps:
      - run: echo ok

