# Throwaway probe, never merged: stands in for CI on one pull request to see what GitHub does with the five required checks of main.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  linux_leg:
    name: Linux leg that fails
    runs-on: ubuntu-latest
    steps:
      - run: exit 1

  linux:
    name: Linux (GCC)
    needs: linux_leg
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.linux_leg.result }}
        run: |
          echo "leg: $RESULT"
          [ "$RESULT" = success ]

  macos:
    name: macOS (Apple clang)
    runs-on: ubuntu-latest
    steps:
      - run: echo ok

  windows:
    name: Windows (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC 2022
          - name: MSVC 2026
    steps:
      - run: echo ok

  web:
    name: Web (Emscripten, Docker image)
    runs-on: ubuntu-latest
    steps:
      - run: echo ok

