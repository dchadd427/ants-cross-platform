# Version updates: once a week, one pull request per kind of dependency (grouped), against home-next (where the next release is made), each built and tested by CI like any other change.
# Kinds: the image converter's Python packages (imgconv/requirements.txt, pinned by version and hash), the base images of every Dockerfile* in the repository root (pinned by tag and digest) and the
# actions of the workflows.
# Security updates are not set here: Dependabot raises them from the repository's own setting, for the default branch, as soon as an advisory is published.
# A new minor or major version of the Python interpreter or of Emscripten changes what the images compile and run: those two are decided by a person, and only their patch releases are proposed here.
version: 2
updates:
  - package-ecosystem: pip
    directory: /imgconv
    target-branch: home-next
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    groups:
      python-packages:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    target-branch: home-next
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: emscripten/emsdk
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: home-next
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    groups:
      actions:
        patterns: ["*"]
